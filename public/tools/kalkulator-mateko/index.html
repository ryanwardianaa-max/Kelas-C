<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4338ca">
<title>Kalkulator Matematika Ekonomi</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<style>
:root{--p:#4338ca;--a:#6366f1;--bg:#f8fafc;--card:#fff;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--red:#b91c1c;--green:#047857}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.top{position:sticky;top:0;z-index:10;color:#fff;background:linear-gradient(120deg,var(--p),var(--a));box-shadow:0 4px 18px #312e8155}.nav{max-width:1180px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.nav-back-btn{color:#fff;text-decoration:none;border:1px solid #ffffff55;background:#ffffff1f;border-radius:9px;padding:7px 11px;font-weight:700}.brand{text-align:right;font-weight:800}.brand small{display:block;font-weight:400;color:#e0e7ff}.wrap{max-width:1180px;margin:auto;padding:18px 14px 44px}.hero,.panel,.result{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 14px #1e293b0b}.hero{padding:18px;background:linear-gradient(135deg,#fff,#eef2ff)}h1{margin:0;color:#312e81;font-size:clamp(1.35rem,5vw,2rem)}.hero p,.muted{margin:4px 0 0;color:var(--muted)}.modes{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.pill{border:1px solid #c7d2fe;background:#fff;color:#3730a3;border-radius:999px;padding:9px 14px;font-weight:750;cursor:pointer}.pill.active{background:var(--p);border-color:var(--p);color:#fff}.layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:15px}.panel{padding:16px;align-self:start;position:sticky;top:68px}h2,h3{margin:0 0 11px;color:#312e81}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-weight:700;margin-bottom:4px}.field input{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:9px;color:var(--ink);background:#fff}.field input:focus{outline:3px solid #c7d2fe;border-color:var(--a)}.error{min-height:23px;color:var(--red);font-weight:650;margin-top:8px}.outputs{display:grid;gap:13px}.result{padding:17px;overflow:hidden}.math{overflow-x:auto;padding:3px 0}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:11px;border-radius:11px;background:#f8fafc;border:1px solid var(--line)}.metric b{display:block;color:var(--muted);font-size:.8rem}.good{color:var(--green);font-weight:750}.bad{color:var(--red);font-weight:750}.canvas-wrap{height:350px}.canvas-wrap canvas{width:100%;height:100%;display:block}.empty{text-align:center;color:var(--muted);padding:44px 15px}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{position:static}.fields,.summary{grid-template-columns:1fr}.canvas-wrap{height:300px}.brand small{display:none}}@media(max-width:390px){.nav{padding:9px}.back{padding:6px 8px}.wrap{padding:12px 9px 35px}.pill{flex:1;padding:8px}.result,.panel{padding:13px}}
</style>
</head>
<body>
<header class="top"><nav class="nav"><a class="nav-back-btn" href="/" onclick="handleGoBack(event)">← Kembali ke KelasKu</a><div class="brand">Kalkulator Mateko<small>Matematika Ekonomi · KP21517007</small></div></nav></header>
<main class="wrap"><section class="hero"><h1>Kalkulator Matematika Ekonomi</h1><p>Keseimbangan pasar, insidensi pajak atau subsidi, serta biaya dan titik impas.</p></section>
<div class="modes" role="tablist" aria-label="Mode kalkulator"><button class="pill" data-mode="pasar">Pasar</button><button class="pill" data-mode="pajak">Pajak</button><button class="pill" data-mode="subsidi">Subsidi</button><button class="pill" data-mode="biaya">Biaya &amp; BEP</button></div>
<div class="layout"><aside class="panel"><h2 id="inputTitle">Parameter</h2><div class="fields" id="fields"></div><div class="error" id="error" role="alert"></div><p class="muted" id="model"></p></aside><section class="outputs" id="output"><div class="result empty">Masukkan parameter valid untuk melihat hasil.</div></section></div></main>
<script>
'use strict';
const $=s=>document.querySelector(s), storageKey='kalkulatorMatekoState';
const specs={pasar:[['a','Intersep permintaan (a)',100],['b','Kemiringan permintaan (b)',2],['c','Intersep penawaran (c)',20],['d','Kemiringan penawaran (d)',3]],pajak:[['a','Intersep permintaan (a)',100],['b','Kemiringan permintaan (b)',2],['c','Intersep penawaran (c)',20],['d','Kemiringan penawaran (d)',3],['t','Pajak per unit (t)',10]],subsidi:[['a','Intersep permintaan (a)',100],['b','Kemiringan permintaan (b)',2],['c','Intersep penawaran (c)',20],['d','Kemiringan penawaran (d)',3],['s','Subsidi per unit (s)',10]],biaya:[['fc','Biaya tetap (FC)',1000],['v','Biaya variabel/unit (v)',20],['p','Harga/unit (P)',40],['q','Jumlah produksi (Q)',60]]};
let state={mode:'pasar',values:{a:'100',b:'2',c:'20',d:'3',t:'10',s:'10',fc:'1000',v:'20',p:'40',q:'60'}};
try{const x=JSON.parse(localStorage.getItem(storageKey));if(x&&specs[x.mode]&&x.values)state={...state,...x,values:{...state.values,...x.values}}}catch(_){}
function gcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b)[a,b]=[b,a%b];return a||1n}function R(n,d=1n){if(d===0n)throw Error('division by zero');if(d<0n){n=-n;d=-d}const g=gcd(n,d);return {n:n/g,d:d/g}}function rat(v){let s=String(v).trim();if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))throw Error('invalid');s=s.replace(/^\+/,'');if(!s.includes('.'))return R(BigInt(s));const [i,f]=s.split('.');return R(BigInt((i||'0')+(f||'')),10n**BigInt(f.length))}const add=(x,y)=>R(x.n*y.d+y.n*x.d,x.d*y.d),sub=(x,y)=>R(x.n*y.d-y.n*x.d,x.d*y.d),mul=(x,y)=>R(x.n*y.n,x.d*y.d),div=(x,y)=>R(x.n*y.d,x.d*y.n),num=x=>Number(x.n)/Number(x.d),plain=x=>x.d===1n?String(x.n):`${x.n}/${x.d}`,latex=x=>x.d===1n?String(x.n):`\\frac{${x.n}}{${x.d}}`,fmt=x=>`${latex(x)}\\;\\approx\\;${num(x).toLocaleString('id-ID',{maximumFractionDigits:6})}`;
function tex(s,display=false){try{return katex.renderToString(s,{displayMode:display,throwOnError:false})}catch(_){return s}}function math(s){return `<div class="math">${tex(s,true)}</div>`}function metric(k,v){return `<div class="metric"><b>${k}</b>${v}</div>`}
function save(){localStorage.setItem(storageKey,JSON.stringify(state))}function renderInputs(){document.querySelectorAll('.pill').forEach(b=>{b.classList.toggle('active',b.dataset.mode===state.mode);b.setAttribute('aria-selected',b.dataset.mode===state.mode)});$('#inputTitle').textContent=state.mode==='biaya'?'Parameter biaya':'Parameter pasar';$('#fields').innerHTML=specs[state.mode].map(([id,label,def])=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" data-id="${id}" type="number" min="0" step="any" inputmode="decimal" value="${state.values[id]??def}"></div>`).join('');$('#model').innerHTML=state.mode==='biaya'?tex('TC=FC+vQ,\quad TR=PQ'):tex('Q_d=a-bP,\quad Q_s=-c+dP');$('#fields').querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{state.values[i.dataset.id]=i.value;save();update()}));update()}
function values(){const o={};for(const [id] of specs[state.mode])o[id]=rat(state.values[id]);return o}function card(title,body){return `<article class="result"><h3>${title}</h3>${body}</article>`}
function market(v){const den=add(v.b,v.d),pe=div(add(v.a,v.c),den),qe=div(sub(mul(v.a,v.d),mul(v.b,v.c)),den);let pc=pe,pp=pe,q=qe,extra='',shift='';if(state.mode==='pajak'){pp=div(sub(add(v.a,v.c),mul(v.b,v.t)),den);pc=add(pp,v.t);q=sub(v.a,mul(v.b,pc));const ck=sub(pc,pe),pk=sub(pe,pp),total=mul(v.t,q);shift='pajak';extra=card('Insidensi dan penerimaan pemerintah',math(`t_k=P_c-P_e=${fmt(ck)}`)+math(`t_p=P_e-P_p=${fmt(pk)}`)+math(`t_k+t_p=${fmt(add(ck,pk))}=t`)+`<div class="summary">${metric('Beban konsumen',tex(fmt(ck)))}${metric('Beban produsen',tex(fmt(pk)))}${metric('Total pajak, T=tQ_t',tex(fmt(total)))}${metric('Kuantitas baru',tex(fmt(q)))}</div>`)}if(state.mode==='subsidi'){pc=div(sub(add(v.a,v.c),mul(v.d,v.s)),den);pp=add(pc,v.s);q=sub(v.a,mul(v.b,pc));const ck=sub(pe,pc),pk=sub(pp,pe),total=mul(v.s,q);shift='subsidi';extra=card('Pembagian subsidi dan pengeluaran pemerintah',math(`s_k=P_e-P_c=${fmt(ck)}`)+math(`s_p=P_p-P_e=${fmt(pk)}`)+math(`s_k+s_p=${fmt(add(ck,pk))}=s`)+`<div class="summary">${metric('Bagian konsumen',tex(fmt(ck)))}${metric('Bagian produsen',tex(fmt(pk)))}${metric('Total subsidi, S=sQ_s',tex(fmt(total)))}${metric('Kuantitas baru',tex(fmt(q)))}</div>`)}const deriv=card('Keseimbangan awal',math(`a-bP=-c+dP`)+math(`P_e=\\frac{a+c}{b+d}=${fmt(pe)}`)+math(`Q_e=a-bP_e=${fmt(qe)}`)+`<div class="summary">${metric('Harga ekuilibrium',tex(fmt(pe)))}${metric('Kuantitas ekuilibrium',tex(fmt(qe)))}</div>`);let shifted='';if(shift)shifted=card(`Keseimbangan setelah ${shift}`,math(state.mode==='pajak'?`P_c=P_p+t,\\quad a-bP_c=-c+dP_p`:`P_p=P_c+s,\\quad a-bP_c=-c+dP_p`)+`<div class="summary">${metric('Harga konsumen (P_c)',tex(fmt(pc)))}${metric('Harga produsen (P_p)',tex(fmt(pp)))}${metric('Kuantitas',tex(fmt(q)))}</div>`);$('#output').innerHTML=deriv+shifted+extra+card('Grafik permintaan dan penawaran','<div class="canvas-wrap"><canvas id="chart" aria-label="Grafik permintaan, penawaran, dan pergeseran"></canvas></div>');requestAnimationFrame(()=>draw(v,{pe,qe,pc,pp,q}));}
function cost(v){const vc=mul(v.v,v.q),tc=add(v.fc,vc),tr=mul(v.p,v.q),profit=sub(tr,tc),margin=sub(v.p,v.v);let bep;if(margin.n>0n)bep=div(v.fc,margin);const status=profit.n>0n?'<span class="good">Laba</span>':profit.n<0n?'<span class="bad">Rugi</span>':'<span class="good">Impas</span>';$('#output').innerHTML=card('Biaya, penerimaan, dan laba',math(`VC=vQ=${fmt(vc)}`)+math(`TC=FC+vQ=${fmt(tc)}`)+math(`TR=PQ=${fmt(tr)}`)+math(`\\pi=TR-TC=${fmt(profit)}`)+`<div class="summary">${metric('Status',status)}${metric('Laba/rugi',tex(fmt(profit)))}</div>`)+card('Titik impas',bep?math(`PQ=FC+vQ\\Rightarrow Q_{BEP}=\\frac{FC}{P-v}=${fmt(bep)}`)+math(`TR_{BEP}=P\\cdot Q_{BEP}=${fmt(mul(v.p,bep))}`):'<p class="bad">Tidak ada BEP positif hingga: harga harus lebih besar daripada biaya variabel per unit (P &gt; v).</p>')}
function update(){try{const v=values();const required=state.mode==='biaya'?['fc','v','p','q']:Object.keys(v);if(required.some(k=>v[k].n<0n)||state.mode!=='biaya'&&['a','b','c','d'].some(k=>v[k].n<=0n)||(state.mode==='pajak'&&v.t.n<0n)||(state.mode==='subsidi'&&v.s.n<0n))throw Error('range');$('#error').textContent='';state.mode==='biaya'?cost(v):market(v)}catch(_){$('#error').textContent=state.mode==='biaya'?'Gunakan angka ≥ 0 yang valid.':'a, b, c, d harus > 0; pajak/subsidi harus ≥ 0.';$('#output').innerHTML='<div class="result empty">Parameter belum valid. Perbaiki input untuk menghitung.</div>'}}
function draw(v,r){const c=$('#chart'),box=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=Math.round(box.width*dpr);c.height=Math.round(box.height*dpr);const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const w=box.width,h=box.height,pad=42;const maxQ=Math.max(1,num(v.a)*1.12,num(r.q)*1.4),baseMax=Math.max(num(div(v.a,v.b)),num(div(v.c,v.d)),num(r.pc),num(r.pp)),maxP=Math.max(1,baseMax*1.18);const X=q=>pad+q/maxQ*(w-pad-15),Y=p=>h-pad-p/maxP*(h-pad-15);x.strokeStyle='#cbd5e1';x.lineWidth=1;x.beginPath();x.moveTo(pad,10);x.lineTo(pad,h-pad);x.lineTo(w-10,h-pad);x.stroke();x.fillStyle='#64748b';x.font='12px system-ui';x.fillText('P',15,18);x.fillText('Q',w-18,h-18);function line(q1,p1,q2,p2,color,label,dash=[]){x.setLineDash(dash);x.strokeStyle=color;x.lineWidth=2.5;x.beginPath();x.moveTo(X(q1),Y(p1));x.lineTo(X(q2),Y(p2));x.stroke();x.setLineDash([]);x.fillStyle=color;x.fillText(label,X(q2)-25,Y(p2)-7)}line(0,num(div(v.a,v.b)),num(v.a),0,'#dc2626','D');line(0,num(div(v.c,v.d)),maxQ,(maxQ+num(v.c))/num(v.d),'#2563eb','S');if(state.mode==='pajak')line(0,num(div(add(v.c,mul(v.d,v.t)),v.d)),maxQ,(maxQ+num(v.c)+num(mul(v.d,v.t)))/num(v.d),'#7c3aed','S + pajak',[7,5]);if(state.mode==='subsidi')line(0,(num(v.c)-num(mul(v.d,v.s)))/num(v.d),maxQ,(maxQ+num(v.c)-num(mul(v.d,v.s)))/num(v.d),'#059669','S + subsidi',[7,5]);function dot(q,p,label,color){x.fillStyle=color;x.beginPath();x.arc(X(num(q)),Y(num(p)),4.5,0,Math.PI*2);x.fill();x.fillText(label,X(num(q))+7,Y(num(p))-7)}dot(r.qe,r.pe,'E','#111827');if(state.mode!=='pasar')dot(r.q,r.pc,state.mode==='pajak'?'Eₜ':'Eₛ','#7c3aed')}
document.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;save();renderInputs()}));function handleGoBack(e){if(history.length>1){e.preventDefault();history.back()}}window.handleGoBack=handleGoBack;window.addEventListener('resize',()=>update());window.addEventListener('DOMContentLoaded',renderInputs);
</script>
</body></html>
