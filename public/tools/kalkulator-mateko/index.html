<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4338ca">
<title>Kalkulator Matematika Ekonomi</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<style>
:root{--p:#4338ca;--bg:#f8fafc;--ink:#172033;--muted:#64748b;--line:#dbe3ee;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}button,input{font:inherit}.top{position:sticky;top:0;z-index:5;color:#fff;background:linear-gradient(120deg,#4338ca,#6366f1)}.nav{max-width:1180px;margin:auto;padding:10px 16px;display:flex;justify-content:space-between}.nav a{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:6px 10px}.wrap{max-width:1180px;margin:auto;padding:18px 14px 44px}.hero,.panel,.result{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 14px #1e293b0b}.hero,.panel,.result{padding:16px}.hero h1,h2,h3{margin:0 0 9px;color:#312e81}.muted{color:var(--muted)}.modes{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.pill{border:1px solid #c7d2fe;background:#fff;color:#3730a3;border-radius:99px;padding:8px 13px;font-weight:700;cursor:pointer}.pill.active{background:var(--p);color:#fff}.layout{display:grid;grid-template-columns:360px 1fr;gap:14px}.panel{align-self:start;position:sticky;top:62px}.fields{display:grid;gap:10px}.field label{display:block;font-weight:700}.field input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.field input:focus{outline:3px solid #c7d2fe}.error{color:var(--red);font-weight:650;min-height:24px}.outputs{display:grid;gap:12px}.math{overflow:auto;padding:4px 0}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.metric{padding:10px;background:#eef2ff;border-radius:9px}.metric b{display:block;color:#3730a3}.canvas-wrap{height:430px}canvas{width:100%;height:100%;display:block}.empty{text-align:center;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}.panel{position:static}.canvas-wrap{height:340px}}
</style></head><body>
<header class="top"><nav class="nav"><a href="/" onclick="if(history.length>1){event.preventDefault();history.back()}">← Kembali</a><b>Kalkulator Mateko</b></nav></header>
<main class="wrap"><section class="hero"><h1>Kalkulator Matematika Ekonomi</h1><div class="muted">Persamaan linier fleksibel, hasil eksak, aljabar, dan grafik berskala.</div></section><div class="modes" role="tablist"><button class="pill" data-mode="pasar">Pasar</button><button class="pill" data-mode="pajak">Pajak</button><button class="pill" data-mode="subsidi">Subsidi</button><button class="pill" data-mode="multi">2 Komoditas (Multi-Pasar)</button><button class="pill" data-mode="biaya">Biaya &amp; BEP</button></div><div class="layout"><aside class="panel"><h2>Input</h2><div id="fields" class="fields"></div><div id="error" class="error" role="alert"></div><div id="model" class="muted"></div></aside><section id="output" class="outputs"><div class="result empty">Masukkan fungsi valid.</div></section></div></main>
<script>
'use strict';
const $=s=>document.querySelector(s),key='kalkulatorMatekoStateV2';
function gcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b)[a,b]=[b,a%b];return a||1n}function R(n,d=1n){if(!d)throw Error('Penyebut nol.');if(d<0n)n=-n,d=-d;let g=gcd(n,d);return{n:n/g,d:d/g}}function rat(s){s=String(s).trim().replace(',','.');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:\/\d+)?$/.test(s))throw Error(`Angka tidak valid: ${s}`);if(s.includes('/')){let[a,b]=s.split('/');return div(rat(a),rat(b))}let sign=s[0]=='-'?-1n:1n;s=s.replace(/^[+-]/,'');if(!s.includes('.'))return R(sign*BigInt(s));let[i,f]=s.split('.');return R(sign*BigInt((i||'0')+f),10n**BigInt(f.length))}const add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>R(a.n*b.d,a.d*b.n),neg=a=>R(-a.n,a.d),N=a=>Number(a.n)/Number(a.d),z=R(0n),one=R(1n);
function exact(a){if(a.d===1n)return String(a.n);let sign=a.n<0n?'-':'',n=a.n<0n?-a.n:a.n,w=n/a.d,r=n%a.d;return sign+(w?`${w}\\frac{${r}}{${a.d}}`:`\\frac{${n}}{${a.d}}`)}function show(a){return `${exact(a)}\;(${N(a).toLocaleString('id-ID',{maximumFractionDigits:6})})`}function tex(s,d=true){return window.katex?katex.renderToString(s,{displayMode:d,throwOnError:false}):s}const math=s=>`<div class="math">${tex(s)}</div>`,card=(t,b)=>`<article class="result"><h3>${t}</h3>${b}</article>`,metric=(k,v)=>`<div class="metric"><b>${k}</b>${tex(v,false)}</div>`;
function expression(src,vars){src=src.replace(/\s+/g,'').replace(/−/g,'-').replace(/\*/g,'');if(!src)throw Error('Ekspresi kosong.');let out={c:z};vars.forEach(v=>out[v]=z);src=src.replace(/-/g,'+-');if(src[0]=='+')src=src.slice(1);for(let term of src.split('+')){if(!term)continue;let found=vars.filter(v=>term.toLowerCase().endsWith(v.toLowerCase()));if(found.length){let v=found[0],coef=term.slice(0,-v.length);if(vars.some(x=>coef.toLowerCase().includes(x.toLowerCase())))throw Error('Perkalian variabel tidak linier.');out[v]=add(out[v],coef===''?one:coef==='-'?neg(one):rat(coef))}else out.c=add(out.c,rat(term))}return out}
function parseEquation(text,vars=['Q','P']){let s=text.replace(/Q_[dDsS]/g,'Q').replace(/P_[dDsS]/g,'P'),parts=s.split('=');if(parts.length>2)throw Error('Gunakan tepat satu tanda =.');let L=expression(parts[0],vars),Rr=parts[1]===undefined?{c:z,...Object.fromEntries(vars.map(v=>[v,z]))}:expression(parts[1],vars),o={raw:text,c:sub(L.c,Rr.c)};vars.forEach(v=>o[v]=sub(L[v],Rr[v]));if(vars.every(v=>!o[v].n))throw Error('Persamaan tidak memiliki variabel.');return o}
function qForm(e){if(!e.Q.n)throw Error('Koefisien Q tidak boleh nol.');return{a:div(neg(e.c),e.Q),b:div(neg(e.P),e.Q)}}function evalQ(f,p){return add(f.a,mul(f.b,p))}function solveMarket(d,s){let D=qForm(d),S=qForm(s),den=sub(D.b,S.b);if(!den.n)throw Error('Kurva sejajar; ekuilibrium tunggal tidak ada.');let p=div(sub(S.a,D.a),den),q=evalQ(D,p);return{D,S,p,q}}
const defaults={pasar:{d:'Q = 100 - 2P',s:'Q = -20 + 3P'},pajak:{d:'Q = 100 - 2P',s:'Q = -20 + 3P',t:'5'},subsidi:{d:'P = 36 - 4Q',s:'P = 4 + 4Q',u:'2'},multi:{dx:'Q = 10 - 2Px + Py',sx:'Q = -2 + 3Px',dy:'Q = 15 + Px - Py',sy:'Q = -1 + 2Py'},biaya:{fc:'1000',v:'20',p:'40',q:'60'}};let state={mode:'pasar',values:{}};try{let x=JSON.parse(localStorage.getItem(key));if(x&&defaults[x.mode])state=x}catch(_){}function save(){localStorage.setItem(key,JSON.stringify(state))}
function fields(){let m=state.mode,labels=m==='multi'?{dx:'Permintaan X',sx:'Penawaran X',dy:'Permintaan Y',sy:'Penawaran Y'}:m==='biaya'?{fc:'Biaya tetap',v:'Biaya variabel/unit',p:'Harga/unit',q:'Produksi'}:{d:'Fungsi permintaan',s:'Fungsi penawaran',t:'Pajak/unit',u:'Subsidi/unit'};let vals={...defaults[m],...(state.values[m]||{})};$('#fields').innerHTML=Object.keys(defaults[m]).map(id=>`<div class="field"><label for="${id}">${labels[id]}</label><input id="${id}" data-id="${id}" value="${String(vals[id]).replace(/"/g,'&quot;')}" autocomplete="off"></div>`).join('');$('#model').textContent=m==='multi'?'Variabel: Q, Px, Py':'Format: Q=…, P=…, atau implisit; angka 1/2 atau 0,5.';document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('#fields').querySelectorAll('input').forEach(i=>i.oninput=()=>{state.values[m]??={};state.values[m][i.dataset.id]=i.value;save();update()});update()}
function current(){return Object.fromEntries([...$('#fields input')].map(i=>[i.dataset.id,i.value]))}function eqLatex(f){return `Q=${exact(f.a)}${f.b.n<0n?'-':'+'}${exact(f.b.n<0n?neg(f.b):f.b)}P`}
function market(){let v=current(),d=parseEquation(v.d),s=parseEquation(v.s),base=solveMarket(d,s),now=base,amount=z;if(state.mode!=='pasar'){amount=rat(state.mode==='pajak'?v.t:v.u);if(amount.n<0n)throw Error('Pajak/subsidi harus ≥ 0.');let S={...base.S,a:add(base.S.a,mul(base.S.b,state.mode==='pajak'?neg(amount):amount))};let den=sub(base.D.b,S.b),pc=div(sub(S.a,base.D.a),den),q=evalQ(base.D,pc),pp=state.mode==='pajak'?sub(pc,amount):add(pc,amount);now={...base,p:pc,q,pp,S}}
let body=math(`\text{Permintaan: }${eqLatex(base.D)}`)+math(`\text{Penawaran: }${eqLatex(base.S)}`)+math(`${eqLatex(base.D)}=${eqLatex(base.S)}`)+math(`(${exact(base.D.b)}-${exact(base.S.b)})P=${exact(sub(base.S.a,base.D.a))}`)+math(`P_e=${show(base.p)},\quad Q_e=${show(base.q)}`)+`<div class="summary">${metric('Pₑ',show(base.p))}${metric('Qₑ',show(base.q))}</div>`;
if(state.mode!=='pasar'){let tax=state.mode==='pajak',consumer=tax?sub(now.p,base.p):sub(base.p,now.p),producer=tax?sub(base.p,now.pp):sub(now.pp,base.p),total=mul(amount,now.q),name=tax?'pajak':'subsidi';body+=math(`P_s' = P_s ${tax?'+':'-'} ${exact(amount)}`)+math(`Q_d=Q_s'\Rightarrow P_${tax?'t':'s'}=${show(now.p)},\ Q_${tax?'t':'s'}=${show(now.q)}`)+math(`${tax?'t_k':'s_k'}=${show(consumer)},\quad ${tax?'t_p':'s_p'}=${show(producer)}`)+math(`${tax?'T':'S'}=${exact(amount)}\times${exact(now.q)}=${show(total)}`)+`<div class="summary">${metric('Harga konsumen',show(now.p))}${metric('Harga produsen',show(now.pp))}${metric(`Total ${name}`,show(total))}</div>`}
$('#output').innerHTML=card('Langkah aljabar',body)+card('Grafik Kartesius','<div class="canvas-wrap"><canvas id="chart"></canvas></div>');requestAnimationFrame(()=>draw(base,now))}
function multi(){let v=current(),vars=['Q','Px','Py'],fs={};for(let k of ['dx','sx','dy','sy'])fs[k]=parseEquation(v[k],vars);function balance(a,b){let e={};for(let k of ['c','Q','Px','Py'])e[k]=sub(a[k],b[k]);if(e.Q.n)throw Error('Koefisien Q kedua sisi pasar harus sama setelah penyamaan.');return e}let x=balance(fs.dx,fs.sx),y=balance(fs.dy,fs.sy),det=sub(mul(x.Px,y.Py),mul(y.Px,x.Py));if(!det.n)throw Error('SPLDV tidak punya solusi tunggal.');let C1=neg(x.c),C2=neg(y.c),px=div(sub(mul(C1,y.Py),mul(C2,x.Py)),det),py=div(sub(mul(x.Px,C2),mul(y.Px,C1)),det);let qx=div(neg(add(fs.dx.c,add(mul(fs.dx.Px,px),mul(fs.dx.Py,py)))),fs.dx.Q),qy=div(neg(add(fs.dy.c,add(mul(fs.dy.Px,px),mul(fs.dy.Py,py)))),fs.dy.Q);let e1=`${exact(x.Px)}P_x+${exact(x.Py)}P_y=${exact(C1)}`,e2=`${exact(y.Px)}P_x+${exact(y.Py)}P_y=${exact(C2)}`;$('#output').innerHTML=card('Eliminasi dua pasar',math(`Q_{dx}=Q_{sx}\Rightarrow ${e1}`)+math(`Q_{dy}=Q_{sy}\Rightarrow ${e2}`)+math(`\Delta=A_1B_2-A_2B_1=${exact(det)}`)+math(`P_x^*=\frac{C_1B_2-C_2B_1}{\Delta}=${show(px)}`)+math(`P_y^*=\frac{A_1C_2-A_2C_1}{\Delta}=${show(py)}`)+math(`Q_x^*=${show(qx)},\quad Q_y^*=${show(qy)}`)+`<div class="summary">${metric('P*x',show(px))}${metric('P*y',show(py))}${metric('Q*x',show(qx))}${metric('Q*y',show(qy))}</div>`)}
function cost(){let v=current(),fc=rat(v.fc),u=rat(v.v),p=rat(v.p),q=rat(v.q);if([fc,u,p,q].some(x=>x.n<0n))throw Error('Nilai biaya harus ≥ 0.');let tc=add(fc,mul(u,q)),tr=mul(p,q),profit=sub(tr,tc),margin=sub(p,u);$('#output').innerHTML=card('Biaya dan BEP',math(`TC=FC+vQ=${show(tc)}`)+math(`TR=PQ=${show(tr)}`)+math(`\pi=TR-TC=${show(profit)}`)+(margin.n>0n?math(`Q_{BEP}=\frac{FC}{P-v}=${show(div(fc,margin))}`):'<b>Harga harus melebihi biaya variabel untuk BEP positif.</b>'))}
function draw(base,now){let c=$('#chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let g=c.getContext('2d');g.scale(d,d);let pad=58,w=r.width,h=r.height,pts=[base.p,base.q,now.p,now.q],pmax=Math.max(1,N(div(neg(base.D.a),base.D.b)),N(div(neg(base.S.a),base.S.b)),...pts.map(N))*1.2,qmax=Math.max(1,N(base.D.a),N(base.S.a),...pts.map(N))*1.2,X=q=>pad+q/qmax*(w-pad-18),Y=p=>h-pad-p/pmax*(h-pad-18);g.font='11px system-ui';g.strokeStyle='#dbe3ee';for(let i=0;i<=5;i++){let q=qmax*i/5,p=pmax*i/5;g.beginPath();g.moveTo(X(q),12);g.lineTo(X(q),h-pad);g.moveTo(pad,Y(p));g.lineTo(w-12,Y(p));g.stroke();g.fillStyle='#64748b';g.fillText(q.toFixed(1),X(q)-10,h-pad+17);g.fillText(p.toFixed(1),4,Y(p)+4)}g.strokeStyle='#334155';g.beginPath();g.moveTo(pad,10);g.lineTo(pad,h-pad);g.lineTo(w-10,h-pad);g.stroke();g.fillText('P',pad-18,15);g.fillText('Q',w-15,h-pad+18);function line(f,color,label,dash=[]){g.setLineDash(dash);g.strokeStyle=color;g.lineWidth=2.5;g.beginPath();g.moveTo(X(N(f.a)),Y(0));g.lineTo(X(0),Y(N(div(neg(f.a),f.b))));g.stroke();g.setLineDash([]);g.fillStyle=color;g.fillText(label,X(0)+5,Y(N(div(neg(f.a),f.b)))-5);g.fillText(`(${N(f.a).toFixed(2)},0)`,X(N(f.a))-25,Y(0)-7)}line(base.D,'#dc2626','D');line(base.S,'#2563eb','S');if(state.mode!=='pasar')line(now.S,state.mode==='pajak'?'#7c3aed':'#059669',state.mode==='pajak'?'S+t':'S-s',[7,5]);function dot(q,p,label,color){let x=X(N(q)),y=Y(N(p));g.setLineDash([4,4]);g.strokeStyle=color;g.beginPath();g.moveTo(x,y);g.lineTo(x,Y(0));g.moveTo(x,y);g.lineTo(X(0),y);g.stroke();g.setLineDash([]);g.fillStyle=color;g.beginPath();g.arc(x,y,5,0,7);g.fill();g.fillText(`${label} (${N(q).toFixed(2)}, ${N(p).toFixed(2)})`,x+7,y-8)}dot(base.q,base.p,'E','#111827');if(state.mode!=='pasar')dot(now.q,now.p,state.mode==='pajak'?'Et':'Es','#7c3aed')}
function update(){try{$('#error').textContent='';state.mode==='multi'?multi():state.mode==='biaya'?cost():market()}catch(e){$('#error').textContent=e.message;$('#output').innerHTML='<div class="result empty">Input belum valid.</div>'}}document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();fields()});window.addEventListener('resize',()=>state.mode!=='multi'&&state.mode!=='biaya'&&update());window.addEventListener('DOMContentLoaded',fields);
function selfTest(){console.assert(N(solveMarket(parseEquation('Q + 2P = 100'),parseEquation('Q=-20+3P')).p)===24);console.assert(N(solveMarket(parseEquation('P=36-4Q'),parseEquation('P=4+4Q')).q)===4);console.assert(exact(rat('7/3'))==='2\\frac{1}{3}')}selfTest();
</script></body></html>
