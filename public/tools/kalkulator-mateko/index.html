function money(x){return x.toLocaleString('id-ID',{maximumFractionDigits:2})}function business(){let v=current(),r=state.mode==='biaya'?calculateBusiness({fixedCost:v.fc,price:v.p,variableCost:v.v,quantity:v.q}):calculatePercentageScenario({fixedCost:v.fc,price:v.p,variablePercent:v.vp,quantity:v.q});$('#output').innerHTML=card('Langkah biaya, BEP, dan laba',`<p>Margin kontribusi = P − VC = <b>Rp ${money(r.contribution)}</b> per unit.</p><p>Q<sub>BEP</sub> = FC/(P−VC) = ${money(r.fc)}/${money(r.contribution)} = <b>${money(r.bepExact)} unit</b>.</p><p>Target produksi aman = <b>${r.bepSafe.toLocaleString('id-ID')} unit</b> (dibulatkan ke atas).</p><p>TR = P×Q = <b>Rp ${money(r.totalRevenue)}</b>.</p><p>TC = FC + VC×Q = <b>Rp ${money(r.totalCost)}</b>.</p><p>Laba = TR − TC = <b>Rp ${money(r.profit)}</b>.</p>`)}function consumption(){let v=current(),r=calculateConsumption({autonomousConsumption:v.a,mpc:v.mpc,disposableIncome:v.yd,scale:v.scale});$('#output').innerHTML=card('Langkah konsumsi dan tabungan',`<p>Fungsi konsumsi: C = ${money(r.constant)} + ${money(r.b)}Y<sub>d</sub>.</p><p>MPS = 1 − MPC = ${money(r.mps)}.</p><p>Fungsi tabungan: S = −${money(r.constant)} + ${money(r.mps)}Y<sub>d</sub>.</p><p>C = ${money(r.constant)} + ${money(r.b)}×${money(r.yd)} = <b>${money(r.consumption)}</b>.</p><p>S = ${money(r.yd)} − ${money(r.consumption)} = <b>${money(r.saving)}</b>.</p><p>Pemeriksaan: C + S = <b>${money(r.consumption+r.saving)}</b> = Y<sub>d</sub>.</p>`)}
function draw(base,now){let c=$('#chart');if(!c)return;let r=c.getBoundingClientRect(),d=devicePixelRatio||1;if(!r.width||!r.height)return;c.width=r.width*d;c.height=r.height*d;let g=c.getContext('2d');g.scale(d,d);let pad=58,w=r.width,h=r.height,curves=[base.D,base.S,...(state.mode==='pasar'?[]:[now.S])],points=[[N(base.q),N(base.p)],...(state.mode==='pasar'?[]:[[N(now.q),N(now.p)]])],values=curves.flatMap(f=>[N(f.a),N(evalQ(f,R(0n))) ,f.b.n?N(div(neg(f.a),f.b)):0]).concat(points.flat()),limit=Math.max(1,...values.map(x=>Number.isFinite(x)?Math.abs(x):0))*1.2,qmin=Math.min(0,...values.filter(Number.isFinite).map(x=>-Math.abs(x))),qmax=Math.max(1,...values.filter(Number.isFinite).map(Math.abs)),pmin=qmin,pmax=Math.max(1,limit),X=q=>pad+(q-qmin)/(qmax-qmin)*(w-pad-18),Y=p=>12+(pmax-p)/(pmax-pmin)*(h-pad-12);g.save();g.beginPath();g.rect(pad,12,w-pad-18,h-pad-12);g.clip();g.font='11px system-ui';g.strokeStyle='#dbe3ee';for(let i=0;i<=5;i++){let q=qmin+(qmax-qmin)*i/5,p=pmin+(pmax-pmin)*i/5;g.beginPath();g.moveTo(X(q),12);g.lineTo(X(q),h-pad);g.moveTo(pad,Y(p));g.lineTo(w-18,Y(p));g.stroke()}function line(f,color,label,dash=[]){g.setLineDash(dash);g.strokeStyle=color;g.lineWidth=2.5;g.beginPath();g.moveTo(X(N(evalQ(f,rat(String(pmin))))),Y(pmin));g.lineTo(X(N(evalQ(f,rat(String(pmax))))),Y(pmax));g.stroke();g.setLineDash([]);g.fillStyle=color;g.fillText(label,X(N(evalQ(f,rat(String(pmax)))))+4,Y(pmax)+12)}line(base.D,'#dc2626','D');line(base.S,'#2563eb','S');if(state.mode!=='pasar')line(now.S,state.mode==='pajak'?'#7c3aed':'#059669',state.mode==='pajak'?'S+t':'S-s',[7,5]);function dot(q,p,label,color){let qn=N(q),pn=N(p),x=X(qn),y=Y(pn);g.setLineDash([4,4]);g.strokeStyle=color;g.beginPath();g.moveTo(x,y);g.lineTo(x,Y(0));g.moveTo(x,y);g.lineTo(X(0),y);g.stroke();g.setLineDash([]);g.fillStyle=color;g.beginPath();g.arc(x,y,5,0,7);g.fill();g.fillText(`${label} (${qn.toFixed(2)}, ${pn.toFixed(2)})`,x+7,y-8)}dot(base.q,base.p,'E','#111827');if(state.mode!=='pasar')dot(now.q,now.p,state.mode==='pajak'?'Et':'Es','#7c3aed');g.restore();g.strokeStyle='#334155';g.beginPath();g.moveTo(X(0),12);g.lineTo(X(0),h-pad);g.moveTo(pad,Y(0));g.lineTo(w-18,Y(0));g.stroke();g.fillStyle='#64748b';g.font='11px system-ui';for(let i=0;i<=5;i++){let q=qmin+(qmax-qmin)*i/5,p=pmin+(pmax-pmin)*i/5;g.fillText(q.toFixed(1),X(q)-10,h-pad+17);g.fillText(p.toFixed(1),4,Y(p)+4)}g.fillText('P',X(0)-18,15);g.fillText('Q',w-15,Y(0)+18)}

function nonLinear(){
  const v=current(),r=calculateNonLinearMarket({demand:v.d,supply:v.s,tax:v.t,subsidy:v.u});
  const varN=r.variable,othN=r.isPFunc?"P":"Q";
  let eqLabel = r.isPFunc ? "P_d = P_s" : "Q_d = Q_s";
  let body=math("\\text{Kondisi Keseimbangan: } " + eqLabel);
  const aSign=r.A<0?"-":"";const aAbs=Math.abs(r.A)===1?"":Math.abs(r.A);
  const bSign=r.B<0?"-":"+";const bAbs=Math.abs(r.B)===1?"":Math.abs(r.B);
  const cSign=r.C<0?"-":"+";const cAbs=Math.abs(r.C);
  body+=math(`${aSign}${aAbs}${varN}^2 ${bSign} ${bAbs}${varN} ${cSign} ${cAbs} = 0`);
  const disc=r.B*r.B - 4*r.A*r.C;
  body+=math(`D = b^2 - 4ac = (${r.B})^2 - 4(${r.A})(${r.C}) = ${disc}`);
  const rootsStr=r.roots.map(x=>Number.isInteger(x)?String(x):x.toFixed(4)).join(",\\ ");
  body+=math(`${varN}_{1,2} = \\frac{-(${r.B}) \\pm \\sqrt{${disc}}}{2(${r.A})} \\implies \\{${rootsStr}\\}`);
  body+=`<p>Karena kuantitas dan harga dalam ekonomi harus bernilai positif, diambil <b>${varN} = ${r.validRoots[0].toLocaleString("id-ID",{maximumFractionDigits:4})}</b>.</p>`;
  body+=math(`\\text{Substitusi ke fungsi: } ${othN}_e = ${(r.isPFunc?r.p:r.q).toLocaleString("id-ID",{maximumFractionDigits:4})}`);
  body+=`<div class="summary">
    ${metric(r.isPFunc?"Qₑ (Kuantitas)":"Pₑ (Harga)",(r.isPFunc?r.q:r.p).toLocaleString("id-ID",{maximumFractionDigits:4}))}
    ${metric(r.isPFunc?"Pₑ (Harga)":"Qₑ (Kuantitas)",(r.isPFunc?r.p:r.q).toLocaleString("id-ID",{maximumFractionDigits:4}))}
    ${r.tax>0?metric("Penerimaan Pajak (T)",`Rp ${r.totalTax.toLocaleString("id-ID",{maximumFractionDigits:2})}`):""}
    ${r.subsidy>0?metric("Pengeluaran Subsidi (S)",`Rp ${r.totalSubsidy.toLocaleString("id-ID",{maximumFractionDigits:2})}`):""}
  </div>`;
  if(r.tax>0)body+=`<p>Pajak spesifik t = ${r.tax} menghasilkan penerimaan pajak total bagi pemerintah: T = t × Q<sub>et</sub> = <b>${r.totalTax.toFixed(2)}</b>.</p>`;
  if(r.subsidy>0)body+=`<p>Subsidi spesifik s = ${r.subsidy} menghasilkan pengeluaran subsidi pemerintah: S = s × Q<sub>es</sub> = <b>${r.totalSubsidy.toFixed(2)}</b>.</p>`;
  $("#output").innerHTML=card("Langkah Penyelesaian Keseimbangan Non-Linear",body)+card("Grafik Parabola Keseimbangan Pasar",'<div class="canvas-wrap"><canvas id="chart"></canvas></div>');
  requestAnimationFrame(()=>drawNonLinear(r));
}

function drawNonLinear(r){
  let c=$("#chart");if(!c)return;
  let rect=c.getBoundingClientRect(),d=devicePixelRatio||1;
  if(!rect.width||!rect.height)return;
  c.width=rect.width*d;c.height=rect.height*d;
  let g=c.getContext("2d");g.scale(d,d);
  let pad=58,w=rect.width,h=rect.height;
  let qMax=Math.max(r.q*2,10),pMax=Math.max(r.p*2,20);
  let X=q=>pad+(q/qMax)*(w-pad-18);
  let Y=p=>12+(1-p/pMax)*(h-pad-12);

  g.save();g.beginPath();g.rect(pad,12,w-pad-18,h-pad-12);g.clip();
  g.font="11px system-ui";g.strokeStyle="#dbe3ee";
  for(let i=0;i<=5;i++){
    let q=(qMax*i)/5,p=(pMax*i)/5;
    g.beginPath();g.moveTo(X(q),12);g.lineTo(X(q),h-pad);g.moveTo(pad,Y(p));g.lineTo(w-18,Y(p));g.stroke();
  }
  g.strokeStyle="#dc2626";g.lineWidth=2.5;g.beginPath();
  for(let i=0;i<=80;i++){
    let q=(qMax*i)/80;
    let p=r.isPFunc?(r.D.a*q*q+r.D.b*q+r.D.c):0;
    if(p>=0&&p<=pMax*1.5){if(i===0)g.moveTo(X(q),Y(p));else g.lineTo(X(q),Y(p));}
  }
  g.stroke();
  g.strokeStyle="#2563eb";g.lineWidth=2.5;g.beginPath();
  for(let i=0;i<=80;i++){
    let q=(qMax*i)/80;
    let p=r.isPFunc?(r.S_eff.a*q*q+r.S_eff.b*q+r.S_eff.c):0;
    if(p>=0&&p<=pMax*1.5){if(i===0)g.moveTo(X(q),Y(p));else g.lineTo(X(q),Y(p));}
  }
  g.stroke();
  let x=X(r.q),y=Y(r.p);
  g.setLineDash([4,4]);g.strokeStyle="#111827";
  g.beginPath();g.moveTo(x,y);g.lineTo(x,Y(0));g.moveTo(x,y);g.lineTo(X(0),y);g.stroke();
  g.setLineDash([]);g.fillStyle="#111827";g.beginPath();g.arc(x,y,5,0,7);g.fill();
  g.fillText(`E (${r.q.toFixed(2)}, ${r.p.toFixed(2)})`,x+7,y-8);
  g.restore();
}

function ppf(){
  const v=current(),r=calculatePPF({a:v.a,b:v.b,c:v.c,x:v.x,y:v.y});
  let body=math(`${r.a}X^2 + ${r.b}Y^2 = ${r.c}`);
  body+=`<p><b>Kapasitas Maksimum Produksi:</b></p>`;
  body+=math(`\\text{Jika memproduksi } X \\text{ saja } (Y=0): X_{\\max} = \\sqrt{\\frac{${r.c}}{${r.a}}} = \\mathbf{${r.maxX.toLocaleString("id-ID",{maximumFractionDigits:2})}\\text{ unit}}`);
  body+=math(`\\text{Jika memproduksi } Y \\text{ saja } (X=0): Y_{\\max} = \\sqrt{\\frac{${r.c}}{${r.b}}} = \\mathbf{${r.maxY.toLocaleString("id-ID",{maximumFractionDigits:2})}\\text{ unit}}`);
  if(r.x!==null){
    body+=`<p><b>Kombinasi Produksi untuk Target X = ${r.x}:</b></p>`;
    body+=math(`Y = \\sqrt{\\frac{${r.c} - ${r.a}(${r.x})^2}{${r.b}}} = \\mathbf{${r.y.toLocaleString("id-ID",{maximumFractionDigits:4})}\\text{ unit Y}}`);
  }else if(r.y!==null){
    body+=`<p><b>Kombinasi Produksi untuk Target Y = ${r.y}:</b></p>`;
    body+=math(`X = \\sqrt{\\frac{${r.c} - ${r.b}(${r.y})^2}{${r.a}}} = \\mathbf{${r.x.toLocaleString("id-ID",{maximumFractionDigits:4})}\\text{ unit X}}`);
  }
  body+=`<div class="summary">
    ${metric("X max (Y=0)",r.maxX.toLocaleString("id-ID",{maximumFractionDigits:2}))}
    ${metric("Y max (X=0)",r.maxY.toLocaleString("id-ID",{maximumFractionDigits:2}))}
    ${r.x!==null?metric("Output X",r.x.toLocaleString("id-ID",{maximumFractionDigits:2})):""}
    ${r.y!==null?metric("Output Y",r.y.toLocaleString("id-ID",{maximumFractionDigits:4})):""}
  </div>`;
  $("#output").innerHTML=card("Analisis Kurva Transformasi Produksi (PPF)",body)+card("Grafik Batas Kemungkinan Produksi (PPF)",'<div class="canvas-wrap"><canvas id="chart"></canvas></div>');
  requestAnimationFrame(()=>drawPPF(r));
}

function drawPPF(r){
  let c=$("#chart");if(!c)return;
  let rect=c.getBoundingClientRect(),d=devicePixelRatio||1;
  if(!rect.width||!rect.height)return;
  c.width=rect.width*d;c.height=rect.height*d;
  let g=c.getContext("2d");g.scale(d,d);
  let pad=58,w=rect.width,h=rect.height;
  let xMax=r.maxX*1.2,yMax=r.maxY*1.2;
  let X=x=>pad+(x/xMax)*(w-pad-18);
  let Y=y=>12+(1-y/yMax)*(h-pad-12);

  g.save();g.beginPath();g.rect(pad,12,w-pad-18,h-pad-12);g.clip();
  g.font="11px system-ui";g.strokeStyle="#dbe3ee";
  for(let i=0;i<=5;i++){
    let x=(xMax*i)/5,y=(yMax*i)/5;
    g.beginPath();g.moveTo(X(x),12);g.lineTo(X(x),h-pad);g.moveTo(pad,Y(y));g.lineTo(w-18,Y(y));g.stroke();
  }
  g.strokeStyle="#0891b2";g.lineWidth=3;g.beginPath();
  for(let i=0;i<=80;i++){
    let x=(r.maxX*i)/80;
    let y=Math.sqrt(Math.max(0,(r.c - r.a*x*x)/r.b));
    if(i===0)g.moveTo(X(x),Y(y));else g.lineTo(X(x),Y(y));
  }
  g.stroke();
  if(r.x!==null&&r.y!==null){
    let px=X(r.x),py=Y(r.y);
    g.setLineDash([4,4]);g.strokeStyle="#7c3aed";
    g.beginPath();g.moveTo(px,py);g.lineTo(px,Y(0));g.moveTo(px,py);g.lineTo(X(0),py);g.stroke();
    g.setLineDash([]);g.fillStyle="#7c3aed";g.beginPath();g.arc(px,py,5,0,7);g.fill();
    g.fillText(`Pilih (${r.x.toFixed(1)}, ${r.y.toFixed(2)})`,px+7,py-8);
  }
  g.restore();
}

function update(){try{$('#error').textContent='';state.mode==='multi'?multi():state.mode==='nonLinear'?nonLinear():state.mode==='ppf'?ppf():state.mode==='konsumsi'?consumption():(state.mode==='biaya'||state.mode==='biayaPersen')?business():market()}catch(e){$('#error').textContent=e.message;$('#output').innerHTML='<div class="result empty">Input belum valid.</div>'}}document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();fields()});window.addEventListener('resize',()=>!['multi','biaya','biayaPersen','konsumsi'].includes(state.mode)&&update());window.addEventListener('DOMContentLoaded',fields);

</script></body></html>
