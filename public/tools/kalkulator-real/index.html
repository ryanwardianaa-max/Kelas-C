<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4338ca">
<title>Kalkulator Analisis Real</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<style>
:root{--p:#4338ca;--q:#6366f1;--bg:#f8fafc;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--ok:#15803d;--bad:#b91c1c;--warn:#b45309}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.top{position:sticky;top:0;z-index:10;color:#fff;background:linear-gradient(120deg,var(--p),var(--q));box-shadow:0 4px 18px #312e8155}.nav{max-width:1120px;margin:auto;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.nav-back-btn{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:7px 11px}.brand{text-align:right;font-weight:800}.brand small{display:block;font-weight:400;color:#e0e7ff}.wrap{max-width:1120px;margin:auto;padding:18px 14px 50px}.hero,.card,.result{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 14px #1e293b0c}.hero{padding:18px 20px;background:linear-gradient(135deg,#fff,#eef2ff)}h1{margin:0;color:#312e81;font-size:clamp(1.4rem,4vw,2rem)}h2{font-size:1.08rem;color:#312e81;margin:0 0 13px}h3{margin:.2rem 0;color:#312e81;font-size:1rem}.muted{color:var(--muted);margin:.25rem 0}.modes{display:flex;gap:8px;margin:15px 0}.pill{border:1px solid #c7d2fe;background:#fff;color:#3730a3;border-radius:999px;padding:9px 16px;font-weight:750;cursor:pointer}.pill.active{background:var(--p);color:#fff;border-color:var(--p)}.view[hidden]{display:none}.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:15px}.card,.result{padding:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:.82rem;font-weight:700;margin-bottom:4px}.field input{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:9px;background:#fff}.field input:focus{outline:3px solid #c7d2fe;border-color:var(--q)}.wide{grid-column:1/-1}.error{color:var(--bad);font-weight:700;min-height:1.5em;margin-top:8px}.formula{overflow:auto;padding:10px;background:#f8fafc;border-radius:10px;margin:9px 0}.status{display:inline-block;border-radius:999px;padding:4px 10px;font-weight:800}.convergen{background:#dcfce7;color:var(--ok)}.divergen{background:#fee2e2;color:var(--bad)}.inkonklusif{background:#ffedd5;color:var(--warn)}canvas{display:block;width:100%;height:330px;border:1px solid var(--line);border-radius:11px;background:#fff}.range-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}.range-row input{width:100%}.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.series-card{cursor:pointer;transition:.15s}.series-card.active{border-color:var(--q);box-shadow:0 0 0 2px #c7d2fe}.derive{margin-top:14px}.step{border-left:3px solid #818cf8;padding:7px 11px;margin:9px 0;background:#f8fafc}.exact{font-weight:800;color:#3730a3}@media(max-width:760px){.grid{grid-template-columns:1fr}.series-grid{grid-template-columns:1fr}canvas{height:280px}.brand small{display:none}}@media(max-width:430px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}.pill{flex:1;padding:8px}.back{font-size:.8rem}}
</style>
</head>
<body>
<header class="top"><nav class="nav"><a class="nav-back-btn" href="/" onclick="handleGoBack(event)">← Kembali ke KelasKu</a><div class="brand">Kalkulator Analisis Real<small>Epsilon–Delta & Uji Deret</small></div></nav></header>
<main class="wrap">
<section class="hero"><h1>Kalkulator Analisis Real</h1><p class="muted">Pembuktian limit linear dan klasifikasi konvergensi deret, langkah demi langkah.</p></section>
<nav class="modes" aria-label="Mode kalkulator"><button class="pill active" data-mode="limit" aria-pressed="true">Epsilon–Delta</button><button class="pill" data-mode="series" aria-pressed="false">Uji Deret</button></nav>
<section class="view" id="limit">
<div class="grid"><article class="card"><h2>Limit fungsi linear</h2><div class="fields"><div class="field"><label for="m">Kemiringan m</label><input id="m" type="number" step="any"></div><div class="field"><label for="k">Konstanta k</label><input id="k" type="number" step="any"></div><div class="field wide"><label for="c">Titik limit c</label><input id="c" type="number" step="any"></div><div class="field wide"><label for="epsilon">ε: <output id="epsOut"></output></label><div class="range-row"><input id="epsilon" type="range" min="0.01" max="10" step="0.01"><input id="epsNumber" type="number" min="0" step="any" aria-label="Nilai epsilon"></div></div></div><div class="error" id="limitError" role="alert"></div></article>
<article class="result"><h2>Derivasi formal</h2><div id="limitResult"></div><canvas id="plot" aria-label="Grafik pita epsilon dan delta"></canvas><p class="muted">Biru: pita horizontal L ± ε. Ungu: pita vertikal c ± δ.</p></article></div>
</section>
<section class="view" id="series" hidden>
<div class="series-grid" id="seriesCards"></div><article class="result derive"><h2>Derivasi dan klasifikasi</h2><div id="seriesResult"></div></article>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), KEY='realAnalysisCalculatorState';
const state={mode:'limit',m:2,k:1,c:3,epsilon:1,test:'ratio',values:{ratio:{r:.5},root:{rho:.8},geometric:{a:1,r:.5},pseries:{p:2}}};
const tests={
 ratio:{title:'Uji Rasio',intro:'Masukkan limit rasio ℓ',fields:[['r','ℓ']],render:v=>{const l=v.r;if(l<0)return invalid('ℓ harus ≥ 0.');const cls=l<1?'convergen':l>1?'divergen':'inkonklusif';return result(cls,`\\ell=\\lim_{n\\to\\infty}\\left|\\frac{a_{n+1}}{a_n}\\right|=${num(l)}`,l<1?'Karena ℓ < 1, deret konvergen absolut.':l>1?'Karena ℓ > 1, suku tidak cukup cepat menuju nol; deret divergen.':'Batas ℓ = 1: uji rasio tidak memberi keputusan. Gunakan uji lain.') }},
 root:{title:'Uji Akar',intro:'Masukkan limit superior akar ρ',fields:[['rho','ρ']],render:v=>{const r=v.rho;if(r<0)return invalid('ρ harus ≥ 0.');const cls=r<1?'convergen':r>1?'divergen':'inkonklusif';return result(cls,`\\rho=\\limsup_{n\\to\\infty}\\sqrt[n]{|a_n|}=${num(r)}`,r<1?'Karena ρ < 1, deret konvergen absolut.':r>1?'Karena ρ > 1, deret divergen.':'Batas ρ = 1: uji akar tidak memberi keputusan.')}},
 geometric:{title:'Deret Geometri',intro:'Deret Σ arⁿ, n = 0 sampai ∞',fields:[['a','a'],['r','r']],render:v=>{const q=Math.abs(v.r),ok=q<1,dec=ok?v.a/(1-v.r):null;return result(ok?'convergen':'divergen',`\\sum_{n=0}^{\\infty}${num(v.a)}(${num(v.r)})^n`,ok?`|r|=${num(q)}<1. Jumlah exact: \\frac{${num(v.a)}}{1-(${num(v.r)})}; decimal: ${fmt(dec)}.`:`|r|=${num(q)} ≥ 1. Suku a·rⁿ tidak menuju 0 (kecuali a = 0). ${v.a===0?'Untuk a = 0, deret nol konvergen dengan jumlah 0.':''}`,v.a===0?'convergen':null)}},
 pseries:{title:'Deret-p',intro:'Deret Σ 1/nᵖ, n = 1 sampai ∞',fields:[['p','p']],render:v=>result(v.p>1?'convergen':'divergen',`\\sum_{n=1}^{\\infty}\\frac1{n^{${num(v.p)}}}`,v.p>1?'p > 1. Uji integral: ∫₁∞x⁻ᵖdx = 1/(p−1), hingga; deret konvergen.':v.p===1?'p = 1. Deret harmonik; divergen.':'p < 1. Integral ∫₁∞x⁻ᵖdx tak hingga; deret divergen.')}
};
function num(x){return Number.isInteger(x)?String(x):String(Number(x.toPrecision(8)))}function fmt(x){return Number(x).toLocaleString('id-ID',{maximumFractionDigits:8})}function tex(s,display=false){const e=document.createElement(display?'div':'span');if(window.katex)katex.render(s,e,{displayMode:display,throwOnError:false});else e.textContent=s;return e.outerHTML}function invalid(s){return `<p class="error">${s}</p>`}function result(cls,formula,why,override){cls=override||cls;return `<div class="step">${tex(formula,true)}</div><div class="step">${why}</div><span class="status ${cls}">${cls[0].toUpperCase()+cls.slice(1)}</span>`}
function finite(ids){return ids.every(id=>Number.isFinite(Number($(id).value)))}
function updateLimit(){if(!finite(['m','k','c','epsNumber'])){$('limitError').textContent='Semua parameter harus berupa bilangan hingga.';$('limitResult').innerHTML='';return}const m=Number($('m').value),k=Number($('k').value),c=Number($('c').value),e=Number($('epsNumber').value);if(e<=0){$('limitError').textContent='Epsilon harus lebih besar dari 0.';$('limitResult').innerHTML='';return}$('limitError').textContent='';Object.assign(state,{m,k,c,epsilon:e});if(e<=10)$('epsilon').value=e;$('epsOut').textContent=fmt(e);const L=m*c+k;if(m===0){$('limitResult').innerHTML=`<div class="formula">${tex(`f(x)=${num(k)},\\quad L=${num(k)}`,true)}</div><div class="step">Untuk setiap ε > 0, |f(x)−L| = 0 < ε.</div><div class="step"><span class="exact">δ bebas:</span> pilih δ = 1 (atau sembarang δ > 0). Tidak ada pembagian dengan |m|.</div>`}else{const d=e/Math.abs(m);$('limitResult').innerHTML=`<div class="formula">${tex(`L=f(c)=${num(m)}(${num(c)})+${num(k)}=${num(L)}`,true)}</div><div class="step">${tex(`|f(x)-L|=|${num(m)}x+${num(k)}-(${num(L)})|=|${num(m)}|\\,|x-${num(c)}|`,true)}</div><div class="step">Pilih ${tex(`\\delta=\\frac{\\varepsilon}{|m|}=\\frac{${num(e)}}{${num(Math.abs(m))}}=${num(d)}`)}. Jika ${tex(`0<|x-c|<\\delta`)}, maka ${tex(`|f(x)-L|<|m|\\delta=\\varepsilon`)}.</div>`}save();draw()}
function draw(){const cv=$('plot'),r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const w=r.width,h=r.height,m=state.m,k=state.k,c=state.c,e=state.epsilon,L=m*c+k,d=m===0?1:e/Math.abs(m),sx=w/(Math.max(4,d*4)),sy=h/(Math.max(4,e*4)),X=t=>w/2+(t-c)*sx,Y=t=>h/2-(t-L)*sy;x.clearRect(0,0,w,h);x.fillStyle='#dbeafe';x.fillRect(0,Y(L+e),w,Y(L-e)-Y(L+e));x.fillStyle='#ede9feaa';x.fillRect(X(c-d),0,X(c+d)-X(c-d),h);x.strokeStyle='#94a3b8';x.beginPath();x.moveTo(0,Y(L));x.lineTo(w,Y(L));x.moveTo(X(c),0);x.lineTo(X(c),h);x.stroke();x.strokeStyle='#4338ca';x.lineWidth=3;x.beginPath();x.moveTo(0,Y(m*(c-w/(2*sx))+k));x.lineTo(w,Y(m*(c+w/(2*sx))+k));x.stroke();x.fillStyle='#172033';x.font='12px system-ui';x.fillText(`L = ${fmt(L)}`,8,Y(L)-7);x.fillText(`c = ${fmt(c)}`,Math.min(w-60,X(c)+6),16)}
function renderCards(){const root=$('seriesCards');root.innerHTML='';Object.entries(tests).forEach(([id,t])=>{const a=document.createElement('article');a.className='card series-card'+(state.test===id?' active':'');a.tabIndex=0;a.setAttribute('role','button');a.innerHTML=`<h3>${t.title}</h3><p class="muted">${t.intro}</p><div class="fields">${t.fields.map(([key,label])=>`<div class="field"><label for="${id}-${key}">${label}</label><input id="${id}-${key}" data-test="${id}" data-key="${key}" type="number" step="any" value="${state.values[id][key]}"></div>`).join('')}</div>`;a.onclick=e=>{if(e.target.tagName!=='INPUT')selectTest(id)};a.onkeydown=e=>{if(e.key==='Enter')selectTest(id)};root.appendChild(a)});root.querySelectorAll('input').forEach(i=>i.oninput=()=>{state.test=i.dataset.test;state.values[state.test][i.dataset.key]=Number(i.value);renderSeries();renderCards();save()});renderSeries()}
function selectTest(id){state.test=id;renderCards();save()}function renderSeries(){const t=tests[state.test],v=state.values[state.test];$('seriesResult').innerHTML=Object.values(v).every(Number.isFinite)?t.render(v):invalid('Semua parameter harus berupa bilangan hingga.')}
function setMode(mode){state.mode=mode;document.querySelectorAll('.pill').forEach(b=>{const on=b.dataset.mode===mode;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on)});document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==mode);save();if(mode==='limit')requestAnimationFrame(draw)}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function handleGoBack(e){if(history.length>1){e.preventDefault();history.back()}}window.handleGoBack=handleGoBack;function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&['limit','series'].includes(s.mode))Object.assign(state,s)}catch(_){}}
window.addEventListener('DOMContentLoaded',()=>{load();['m','k','c'].forEach(id=>{$(id).value=state[id];$(id).oninput=updateLimit});$('epsilon').value=Math.min(10,state.epsilon);$('epsNumber').value=state.epsilon;$('epsilon').oninput=()=>{$('epsNumber').value=$('epsilon').value;updateLimit()};$('epsNumber').oninput=updateLimit;document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));renderCards();setMode(state.mode);updateLimit()});window.addEventListener('resize',()=>{if(state.mode==='limit')draw()});
</script>
</body>
</html>
