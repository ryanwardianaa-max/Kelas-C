<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalkulator Ilmiah & Pecahan</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
:root{--ink:#172033;--muted:#657089;--line:#dfe3ed;--card:#fff;--bg:#f5f6fb;--accent:#5b4fe9;--accent2:#ebe9ff;--danger:#b42318}*{box-sizing:border-box}html,body{margin:0;min-width:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px #1720330d}.nav{max-width:1040px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:14px}.nav-back-btn{color:var(--accent);font-weight:750;text-decoration:none}.nav-title{margin-left:auto;font-weight:800}.wrap{max-width:1040px;margin:22px auto;padding:0 16px 40px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:18px}.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px #1720330a}.display{background:#111827;color:white;border-radius:15px;padding:14px;margin-bottom:12px;overflow:hidden}.expression{width:100%;border:0;outline:0;background:transparent;color:#d9dcef;text-align:right;font-size:1.15rem;min-height:36px}.result{min-height:43px;text-align:right;font-size:1.75rem;font-weight:800;overflow-wrap:anywhere}.status{min-height:22px;color:#aeb7cc;text-align:right;font-size:.86rem}.chips{display:flex;gap:8px;margin:10px 0 14px}.chip{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:750}.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}.keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.key{min-width:0;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 4px;cursor:pointer;font-weight:720;color:var(--ink)}.key:hover,.key:focus-visible{border-color:var(--accent);background:var(--accent2);outline:0}.key.fn{color:#473bc7;background:#f5f3ff}.key.op{background:#eef1f7}.key.danger{color:var(--danger)}.key.equals{background:var(--accent);border-color:var(--accent);color:#fff}.key.wide{grid-column:span 2}.panel-title{margin:0 0 10px;font-size:1rem}.math-box{overflow-x:auto;padding:11px;background:#fafaff;border:1px solid var(--line);border-radius:12px;min-height:48px}.steps{margin:12px 0 0;padding-left:20px}.steps li{margin:7px 0}.history{display:grid;gap:8px;max-height:390px;overflow:auto}.history button{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;cursor:pointer;overflow-wrap:anywhere}.history button:hover{border-color:var(--accent)}.h-expr{color:var(--muted);font-size:.85rem}.h-result{font-weight:800}.empty{color:var(--muted);text-align:center;padding:24px 8px}.section{margin-top:16px}.note{font-size:.83rem;color:var(--muted)}@media(max-width:760px){.wrap{grid-template-columns:1fr;margin-top:14px}.nav-title{font-size:.86rem}.card{padding:13px}.keypad{gap:6px}.key{padding:11px 2px;font-size:.88rem}}@media(max-width:380px){.key{font-size:.78rem}.nav-title{display:none}}
</style>
</head>
<body>
<header class="topbar"><nav class="nav"><a class="nav-back-btn" href="/" onclick="handleGoBack(event)">← Kembali ke KelasKu</a><span class="nav-title">Kalkulator Ilmiah</span></nav></header>
<main class="wrap">
<section class="card" aria-label="Kalkulator">
<div class="display"><input id="expression" class="expression" aria-label="Ekspresi matematika" autocomplete="off" spellcheck="false" placeholder="Contoh: sin(30)+1/2"><div id="result" class="result">0</div><div id="status" class="status">Masukkan ekspresi</div></div>
<div class="chips" role="group" aria-label="Mode sudut"><button class="chip active" data-angle="deg">Deg</button><button class="chip" data-angle="rad">Rad</button></div>
<div class="keypad" id="keypad">
<button class="key danger" data-action="clear">AC</button><button class="key danger" data-action="back">⌫</button><button class="key fn" data-insert="(">(</button><button class="key fn" data-insert=")">)</button><button class="key op" data-insert="/">÷</button>
<button class="key fn" data-insert="sin(">sin</button><button class="key fn" data-insert="cos(">cos</button><button class="key fn" data-insert="tan(">tan</button><button class="key fn" data-insert="sqrt(">√x</button><button class="key op" data-insert="*">×</button>
<button class="key fn" data-insert="ln(">ln</button><button class="key fn" data-insert="log(">log</button><button class="key fn" data-insert="pi">π</button><button class="key fn" data-insert="e">e</button><button class="key op" data-insert="-">−</button>
<button class="key" data-insert="7">7</button><button class="key" data-insert="8">8</button><button class="key" data-insert="9">9</button><button class="key fn" data-action="square">x²</button><button class="key op" data-insert="+">+</button>
<button class="key" data-insert="4">4</button><button class="key" data-insert="5">5</button><button class="key" data-insert="6">6</button><button class="key fn" data-insert="^">xʸ</button><button class="key fn" data-action="fraction">a/b</button>
<button class="key" data-insert="1">1</button><button class="key" data-insert="2">2</button><button class="key" data-insert="3">3</button><button class="key" data-insert=".">.</button><button class="key equals" data-action="equals">=</button>
<button class="key wide" data-insert="0">0</button><button class="key" data-insert="ans">Ans</button><button class="key fn wide" data-action="toggle">Eksak ↔ Desimal</button>
</div>
<p class="note">Keyboard didukung: angka, operator, Enter, Backspace, Escape.</p>
<div class="section"><h2 class="panel-title">Bentuk Matematika</h2><div id="math" class="math-box" aria-live="polite">—</div></div>
<div class="section"><h2 class="panel-title">Derivasi Edukatif</h2><ol id="steps" class="steps"><li>Tulis ekspresi, lalu tekan =.</li></ol></div>
</section>
<aside class="card"><h2 class="panel-title">Riwayat Perhitungan</h2><div id="history" class="history"></div><button id="clearHistory" class="chip section">Hapus riwayat</button></aside>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s), input=$('#expression'), resultEl=$('#result'), statusEl=$('#status'), mathEl=$('#math'), stepsEl=$('#steps'), historyEl=$('#history');
const KEY='kelasku.scientific-calculator.v1';
let state={angle:'deg',ans:0,history:[],exact:null,showExact:true};
try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(_){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
function fraction(x,maxDen=100000){if(!Number.isFinite(x))return null;let sign=x<0?-1:1,v=Math.abs(x),h1=1,h2=0,k1=0,k2=1,b=v;for(let i=0;i<32;i++){let a=Math.floor(b),h=a*h1+h2,k=a*k1+k2;if(k>maxDen)break;if(Math.abs(v-h/k)<1e-12){let g=gcd(h,k);return [sign*h/g,k/g]}[h2,h1]=[h1,h];[k2,k1]=[k1,k];let d=b-a;if(d<1e-15)break;b=1/d}let n=Math.round(v*maxDen),g=gcd(n,maxDen);return[sign*n/g,maxDen/g]}
function tokenize(s){let out=[],i=0;while(i<s.length){let c=s[i];if(/\s/.test(c)){i++;continue}if(/[0-9.]/.test(c)){let m=s.slice(i).match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i);if(!m)throw Error('Angka tidak valid');out.push({t:'num',v:Number(m[0])});i+=m[0].length;continue}if(/[a-z]/i.test(c)){let m=s.slice(i).match(/^[a-z]+/i)[0].toLowerCase();out.push({t:'id',v:m});i+=m.length;continue}if('+-*/^()'.includes(c)){out.push({t:c,v:c});i++;continue}throw Error('Karakter tidak didukung: '+c)}out.push({t:'eof'});return out}
function evaluate(source){let ts=tokenize(source),p=0,peek=()=>ts[p],take=t=>{if(peek().t!==t)throw Error('Ekspresi belum lengkap');return ts[p++]};const funcs={sin:x=>Math.sin(state.angle==='deg'?x*Math.PI/180:x),cos:x=>Math.cos(state.angle==='deg'?x*Math.PI/180:x),tan:x=>Math.tan(state.angle==='deg'?x*Math.PI/180:x),sqrt:Math.sqrt,ln:Math.log,log:Math.log10};function primary(){let z=peek();if(z.t==='num'){p++;return z.v}if(z.t==='id'){p++;if(z.v==='pi')return Math.PI;if(z.v==='e')return Math.E;if(z.v==='ans')return Number(state.ans)||0;if(!funcs[z.v])throw Error('Fungsi tidak dikenal: '+z.v);take('(');let v=expr();take(')');return funcs[z.v](v)}if(z.t==='('){p++;let v=expr();take(')');return v}throw Error('Nilai diharapkan')}function unary(){if(peek().t==='+'){p++;return unary()}if(peek().t==='-'){p++;return-unary()}return primary()}function power(){let a=unary();if(peek().t==='^'){p++;return Math.pow(a,power())}return a}function term(){let a=power();while(peek().t==='*'||peek().t==='/'){let op=ts[p++].t,b=power();if(op==='/'&&b===0)throw Error('Pembagian dengan nol');a=op==='*'?a*b:a/b}return a}function expr(){let a=term();while(peek().t==='+'||peek().t==='-'){let op=ts[p++].t,b=term();a=op==='+'?a+b:a-b}return a}let value=expr();if(peek().t!=='eof')throw Error('Operator diharapkan');if(!Number.isFinite(value))throw Error('Hasil tidak terdefinisi');return value}
const fmt=x=>Number(x.toPrecision(12)).toString();
function latexExpr(s){return s.replace(/sqrt\(/g,'\\sqrt(').replace(/pi/g,'\\pi').replace(/\*/g,'\\times ').replace(/\//g,'\\div ').replace(/\^/g,'^')}
function renderMath(tex){if(window.katex)katex.render(tex,mathEl,{throwOnError:false,displayMode:true});else mathEl.textContent=tex}
function calculate(){let expr=input.value.trim();if(!expr){showError('Masukkan ekspresi');return}try{let value=evaluate(expr),f=fraction(value);state.ans=value;state.exact=f;state.showExact=true;state.history.unshift({expr,value,time:Date.now()});state.history=state.history.slice(0,30);save();showValue();renderHistory();statusEl.textContent='Berhasil • mode '+state.angle.toUpperCase();stepsEl.innerHTML=`<li>Interpretasikan ekspresi pada mode sudut <b>${state.angle.toUpperCase()}</b>.</li><li>Terapkan tanda kurung, fungsi/pangkat, perkalian/pembagian, lalu penjumlahan/pengurangan.</li><li>Nilai numerik diperoleh: <b>${fmt(value)}</b>.</li><li>Sederhanakan rasio dengan FPB: <b>${f[0]}/${f[1]}</b>.</li>`;renderMath(`${latexExpr(expr)} = ${f[1]===1?f[0]:`\\frac{${f[0]}}{${f[1]}}`} \\approx ${fmt(value)}`)}catch(e){showError(e.message)}}
function showValue(){let f=state.exact;if(!f){resultEl.textContent=fmt(state.ans);return}resultEl.textContent=state.showExact?(f[1]===1?String(f[0]):`${f[0]}/${f[1]}`):fmt(state.ans)}
function showError(msg){statusEl.textContent=msg;resultEl.textContent='—';mathEl.textContent='Ekspresi belum dapat dihitung.'}
function insert(text){let a=input.selectionStart??input.value.length,b=input.selectionEnd??a;input.value=input.value.slice(0,a)+text+input.value.slice(b);input.focus();input.setSelectionRange(a+text.length,a+text.length)}
function renderHistory(){historyEl.innerHTML='';if(!state.history.length){historyEl.innerHTML='<div class="empty">Belum ada perhitungan.</div>';return}state.history.forEach(h=>{let b=document.createElement('button');b.type='button';b.innerHTML=`<div class="h-expr"></div><div class="h-result"></div>`;b.children[0].textContent=h.expr;b.children[1].textContent=fmt(h.value);b.onclick=()=>{input.value=h.expr;input.focus()};historyEl.appendChild(b)})}
$('#keypad').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.insert)insert(b.dataset.insert);let a=b.dataset.action;if(a==='clear'){input.value='';resultEl.textContent='0';statusEl.textContent='Dibersihkan';mathEl.textContent='—';stepsEl.innerHTML='<li>Tulis ekspresi, lalu tekan =.</li>'}if(a==='back'){let p=input.selectionStart||0;if(p>0){input.value=input.value.slice(0,p-1)+input.value.slice(input.selectionEnd||p);input.setSelectionRange(p-1,p-1)}}if(a==='square')insert('^2');if(a==='fraction')insert('/');if(a==='equals')calculate();if(a==='toggle'){if(state.exact){state.showExact=!state.showExact;showValue();save()}}};
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{state.angle=b.dataset.angle;document.querySelectorAll('[data-angle]').forEach(x=>x.classList.toggle('active',x===b));save()});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();calculate()}if(e.key==='Escape'){input.value=''}});
$('#clearHistory').onclick=()=>{state.history=[];save();renderHistory()};
function handleGoBack(event){if(history.length>1){event.preventDefault();history.back()}}
document.querySelectorAll('[data-angle]').forEach(x=>x.classList.toggle('active',x.dataset.angle===state.angle));renderHistory();if(state.ans){state.exact=fraction(state.ans);showValue()}
</script>
</body>
</html>
