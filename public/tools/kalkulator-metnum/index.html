<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalkulator Metode Numerik</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7ff;line-height:1.5}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dfe3f3;padding:12px max(16px,calc((100% - 1120px)/2));display:flex;align-items:center;gap:14px}.nav-back-btn{text-decoration:none;color:#4338ca;font-weight:700}h1{font-size:clamp(1rem,3vw,1.35rem);margin:0}main{max-width:1120px;margin:auto;padding:20px 16px 60px}.card{background:#fff;border:1px solid #e0e4f2;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 5px 22px #312e8110}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.pill{border:1px solid #c9cee4;background:#fff;color:#343b55;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}.pill[aria-pressed=true]{background:#4f46e5;color:#fff;border-color:#4f46e5}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.wide{grid-column:span 2}label{display:grid;gap:5px;font-size:.88rem;font-weight:700}input{width:100%;border:1px solid #bcc3da;border-radius:10px;padding:10px;font:inherit;color:inherit}input:focus{outline:3px solid #c7d2fe;border-color:#4f46e5}button.run{margin-top:16px;border:0;border-radius:11px;background:#4f46e5;color:#fff;padding:11px 20px;font-weight:800;cursor:pointer}.hint{font-size:.85rem;color:#5b647b}.error,.success{padding:11px 13px;border-radius:10px;margin-top:14px}.error{background:#fff1f2;color:#9f1239}.success{background:#ecfdf5;color:#065f46}.table-wrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.88rem}th,td{border:1px solid #dde1ee;padding:8px;text-align:right;white-space:nowrap}th{background:#eef2ff;color:#312e81}th:first-child,td:first-child{text-align:center}.math-block{overflow:auto;padding:12px;background:#f8f9ff;border-radius:10px;margin:9px 0}.empty{text-align:center;color:#687086;padding:30px}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.card{padding:14px}header{align-items:flex-start;flex-direction:column;gap:4px}}@media(max-width:420px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}}
</style>
</head>
<body>
<header><a class="nav-back-btn" href="/" onclick="handleGoBack(event)">← Kembali ke KelasKu</a><h1>Kalkulator Metode Numerik</h1></header>
<main>
<section class="card"><strong>Jenis persoalan</strong><div class="pills" id="modePills"><button class="pill" data-mode="root" aria-pressed="true">Akar Persamaan</button><button class="pill" data-mode="integration" aria-pressed="false">Integrasi Numerik</button></div><strong>Metode</strong><div class="pills" id="methodPills"></div></section>
<section class="card"><div class="grid">
<label class="wide">Fungsi f(x)<input id="expr" value="x^3-x-2" autocomplete="off"><span class="hint">Operator: + − * / ^; fungsi: sin, cos, tan, exp, log, sqrt, abs; konstanta: pi, e</span></label>
<label id="derivativeBox" class="wide hidden">Turunan f′(x)<input id="derivative" value="3*x^2-1" autocomplete="off"></label>
<label id="aBox">Batas a<input id="a" type="number" step="any" value="1"></label><label id="bBox">Batas b<input id="b" type="number" step="any" value="2"></label>
<label id="x0Box" class="hidden">Nilai awal x₀<input id="x0" type="number" step="any" value="1.5"></label><label id="x1Box" class="hidden">Nilai awal x₁<input id="x1" type="number" step="any" value="2"></label>
<label id="tolBox">Toleransi<input id="tol" type="number" min="0" step="any" value="0.000001"></label><label id="iterBox">Maksimum iterasi<input id="maxIter" type="number" min="1" max="1000" value="100"></label>
<label id="nBox" class="hidden">Jumlah subinterval n<input id="n" type="number" min="1" max="10000" value="6"></label>
</div><button class="run" id="run">Hitung</button><div id="message" role="status" aria-live="polite"></div></section>
<section class="card" id="result"><div class="empty">Masukkan data, lalu tekan Hitung.</div></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), state={mode:'root',method:'bisection'};
const methods={root:[['bisection','Biseksi'],['regula','Regula Falsi'],['newton','Newton–Raphson'],['secant','Secant']],integration:[['trapezoid','Trapesium Komposit'],['simpson13','Simpson 1/3'],['simpson38','Simpson 3/8']]};
const fields=['expr','derivative','a','b','x0','x1','tol','maxIter','n'];
function handleGoBack(e){if(history.length>1){e.preventDefault();history.back()}}
function num(x){return Number(x).toLocaleString('id-ID',{maximumSignificantDigits:10})}
function tex(s){const d=document.createElement('div');d.className='math-block';try{katex.render(s,d,{throwOnError:false,displayMode:true})}catch{d.textContent=s}return d.outerHTML}
function compile(source){let s=source.trim().toLowerCase();if(!s)throw Error('Fungsi wajib diisi.');if(/[^0-9x+\-*/^().,\s_a-z]/.test(s))throw Error('Ekspresi memuat karakter terlarang.');const names=s.match(/[a-z_]+/g)||[],allowed=new Set(['x','pi','e','sin','cos','tan','asin','acos','atan','sinh','cosh','tanh','exp','log','ln','sqrt','abs','floor','ceil']);if(names.some(n=>!allowed.has(n)))throw Error('Nama fungsi tidak diizinkan: '+names.find(n=>!allowed.has(n)));s=s.replace(/\^/g,'**').replace(/\bln\b/g,'log').replace(/\bpi\b/g,'PI').replace(/\be\b/g,'E').replace(/\b(sin|cos|tan|asin|acos|atan|sinh|cosh|tanh|exp|log|sqrt|abs|floor|ceil)\b/g,'Math.$1');const f=Function('x','"use strict";return ('+s+')');return x=>{const y=f(x);if(!Number.isFinite(y))throw Error('Nilai fungsi tidak terdefinisi pada x = '+num(x)+'.');return y}}
function read(id){const v=Number($(id).value);if(!Number.isFinite(v))throw Error('Input '+id+' harus berupa angka.');return v}
function err(cur,prev){return prev==null?null:Math.abs(cur-prev)/Math.max(1,Math.abs(cur))}
function row(r,a,b,x,fx,e){return `<tr><td>${r}</td><td>${a==null?'—':num(a)}</td><td>${b==null?'—':num(b)}</td><td>${num(x)}</td><td>${num(fx)}</td><td>${e==null?'—':num(e)}</td></tr>`}
function root(){const f=compile($('expr').value),tol=read('tol'),max=read('maxIter');if(tol<=0||!Number.isInteger(max)||max<1)throw Error('Toleransi harus > 0; maksimum iterasi berupa bilangan bulat positif.');let rows='',solution,converged=false,formula='';if(['bisection','regula'].includes(state.method)){let a=read('a'),b=read('b'),fa=f(a),fb=f(b);if(a>=b)throw Error('Syarat interval: a < b.');if(fa*fb>=0)throw Error('Syarat metode: f(a)f(b) < 0.');let prev=null;for(let r=1;r<=max;r++){const x=state.method==='bisection'?(a+b)/2:(a*fb-b*fa)/(fb-fa),fx=f(x),e=err(x,prev);rows+=row(r,a,b,x,fx,e);solution=x;if(Math.abs(fx)<=tol||(e!=null&&e<=tol)){converged=true;break}if(fa*fx<0){b=x;fb=fx}else{a=x;fa=fx}prev=x}formula=state.method==='bisection'?String.raw`x_r=\frac{a_r+b_r}{2}`:String.raw`x_r=\frac{a_r f(b_r)-b_r f(a_r)}{f(b_r)-f(a_r)}`;}else if(state.method==='newton'){const f1=compile($('derivative').value);let x=read('x0');for(let r=1;r<=max;r++){const fx=f(x),df=f1(x);if(Math.abs(df)<Number.EPSILON)throw Error('Turunan nol; iterasi Newton tidak dapat dilanjutkan.');const next=x-fx/df,e=err(next,x),fn=f(next);rows+=row(r,null,null,next,fn,e);solution=next;if(Math.abs(fn)<=tol||e<=tol){converged=true;break}x=next}formula=String.raw`x_{r+1}=x_r-\frac{f(x_r)}{f'(x_r)}`;}else{let p=read('x0'),q=read('x1');if(p===q)throw Error('Secant memerlukan x₀ ≠ x₁.');for(let r=1;r<=max;r++){const fp=f(p),fq=f(q),den=fq-fp;if(Math.abs(den)<Number.EPSILON)throw Error('Penyebut secant nol.');const x=q-fq*(q-p)/den,e=err(x,q),fx=f(x);rows+=row(r,p,q,x,fx,e);solution=x;if(Math.abs(fx)<=tol||e<=tol){converged=true;break}p=q;q=x}formula=String.raw`x_{r+1}=x_r-f(x_r)\frac{x_r-x_{r-1}}{f(x_r)-f(x_{r-1})}`;}return `${tex(formula)}<div class="${converged?'success':'error'}">${converged?'Konvergen':'Belum konvergen'}: x ≈ <strong>${num(solution)}</strong>${converged?'':' setelah batas iterasi.'}</div><div class="table-wrap"><table><thead><tr><th>Iterasi r</th><th>a</th><th>b</th><th>xᵣ</th><th>f(xᵣ)</th><th>Galat relatif εᵣ</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function integration(){const f=compile($('expr').value),a=read('a'),b=read('b'),n=read('n');if(a>=b)throw Error('Syarat interval: a < b.');if(!Number.isInteger(n)||n<1)throw Error('n harus bilangan bulat positif.');if(state.method==='simpson13'&&n%2)throw Error('Simpson 1/3 mensyaratkan n genap.');if(state.method==='simpson38'&&n%3)throw Error('Simpson 3/8 mensyaratkan n kelipatan 3.');const h=(b-a)/n;let sum=0,rows='';for(let i=0;i<=n;i++){const x=a+i*h,y=f(x);let w;if(state.method==='trapezoid')w=(i===0||i===n)?1:2;else if(state.method==='simpson13')w=(i===0||i===n)?1:(i%2?4:2);else w=(i===0||i===n)?1:(i%3?3:2);sum+=w*y;rows+=`<tr><td>${i}</td><td>${num(x)}</td><td>${num(y)}</td><td>${w}</td><td>${num(w*y)}</td></tr>`}const factor=state.method==='trapezoid'?h/2:state.method==='simpson13'?h/3:3*h/8,result=factor*sum;const formula=state.method==='trapezoid'?String.raw`I\approx\frac h2[f(x_0)+2\sum_{i=1}^{n-1}f(x_i)+f(x_n)]`:state.method==='simpson13'?String.raw`I\approx\frac h3[f(x_0)+4\sum_{i\,ganjil}f(x_i)+2\sum_{i\,genap}f(x_i)+f(x_n)]`:String.raw`I\approx\frac{3h}{8}[f(x_0)+3\sum_{i\not\equiv0\ (3)}f(x_i)+2\sum_{i\equiv0\ (3)}f(x_i)+f(x_n)]`;return `${tex(String.raw`h=\frac{b-a}{n}=\frac{${b}-${a}}{${n}}=${num(h)}`)}${tex(formula)}${tex(String.raw`I\approx ${num(factor)}\left(${num(sum)}\right)=${num(result)}`)}<div class="success">Hasil integral ≈ <strong>${num(result)}</strong></div><div class="table-wrap"><table><thead><tr><th>i</th><th>xᵢ</th><th>f(xᵢ)</th><th>Bobot</th><th>Bobot × f(xᵢ)</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function renderMethods(){const box=$('methodPills');box.innerHTML=methods[state.mode].map(([id,label])=>`<button class="pill" data-method="${id}" aria-pressed="${id===state.method}">${label}</button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.method=b.dataset.method;save();renderMethods();toggleFields()});toggleFields()}
function toggleFields(){const root=state.mode==='root',bracket=['bisection','regula'].includes(state.method);$('aBox').classList.toggle('hidden',root&&!bracket);$('bBox').classList.toggle('hidden',root&&!bracket);$('x0Box').classList.toggle('hidden',!root||bracket);$('x1Box').classList.toggle('hidden',state.method!=='secant');$('derivativeBox').classList.toggle('hidden',state.method!=='newton');$('tolBox').classList.toggle('hidden',!root);$('iterBox').classList.toggle('hidden',!root);$('nBox').classList.toggle('hidden',root)}
function save(){const data={mode:state.mode,method:state.method};fields.forEach(id=>data[id]=$(id).value);localStorage.setItem('kalkulator-metnum',JSON.stringify(data))}
function load(){try{const d=JSON.parse(localStorage.getItem('kalkulator-metnum'));if(!d)return;if(methods[d.mode]?.some(x=>x[0]===d.method)){state.mode=d.mode;state.method=d.method}fields.forEach(id=>{if(d[id]!=null)$(id).value=d[id]})}catch{}}
$('modePills').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.method=methods[state.mode][0][0];document.querySelectorAll('#modePills button').forEach(x=>x.setAttribute('aria-pressed',x===b));save();renderMethods()});
$('run').onclick=()=>{try{save();$('message').innerHTML='';$('result').innerHTML=state.mode==='root'?root():integration()}catch(e){$('message').innerHTML=`<div class="error">${e.message}</div>`;$('result').innerHTML='<div class="empty">Perbaiki input untuk menampilkan hasil.</div>'}};
fields.forEach(id=>$(id).addEventListener('change',save));load();document.querySelectorAll('#modePills button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===state.mode));renderMethods();
</script>
</body></html>
