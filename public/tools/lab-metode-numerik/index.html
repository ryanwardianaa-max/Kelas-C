  <style>
    :root{color-scheme:light;--ink:#17231d;--muted:#66736c;--paper:#f7f8f4;--card:#fff;--line:#dce2dc;--brand:#176b4c;--brand2:#e5f3ec;--warn:#8a5200;--warnbg:#fff4d6;--bad:#a52b24;--badbg:#fff0ee;--radius:14px;--shadow:0 10px 30px #18281e0d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);line-height:1.55}button,input,select,textarea{font:inherit}a{color:var(--brand)}.shell{width:min(1180px,100%);margin:auto;padding:18px 14px 48px}.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.back{display:inline-flex;min-height:44px;align-items:center;text-decoration:none;font-weight:700}.hero{display:grid;gap:10px;margin-bottom:22px}.eyebrow{margin:0;color:var(--brand);font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{font-size:clamp(1.8rem,7vw,3.4rem);line-height:1.05;letter-spacing:-.04em;margin:0;max-width:800px}.lead{margin:0;max-width:720px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 12px;scrollbar-width:thin}.tab{flex:0 0 auto;min-height:44px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted);cursor:pointer;font-weight:700}.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:white}.tab:focus-visible,.primary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #52a982;outline-offset:2px}.panel[hidden]{display:none}.workspace{display:grid;gap:14px}.workspace>*{min-width:0}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.form-card{padding:18px}.form-head{display:flex;gap:14px;align-items:start;justify-content:space-between;margin-bottom:16px}.form-head h2{margin:0;font-size:1.22rem}.formula{min-height:30px;color:var(--brand);overflow:auto}.field-grid{display:grid;gap:13px}.field{display:grid;gap:5px}.field label{font-size:.86rem;font-weight:750}.hint{font-size:.76rem;color:var(--muted)}input,select,textarea{width:100%;min-height:46px;border:1px solid #cbd4cd;border-radius:9px;background:white;color:var(--ink);padding:10px 11px}textarea{min-height:90px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9rem}.primary{width:100%;min-height:48px;border:0;border-radius:10px;background:var(--brand);color:white;font-weight:800;cursor:pointer;margin-top:16px}.primary:hover{filter:brightness(.94)}.output{padding:18px;min-height:160px}.empty{display:grid;place-items:center;min-height:125px;text-align:center;color:var(--muted)}.result{border-left:4px solid var(--brand);padding:13px 15px;background:var(--brand2);border-radius:0 10px 10px 0;margin-bottom:14px}.result small{display:block;color:var(--muted);font-weight:700}.result strong{display:block;font-size:clamp(1.25rem,4vw,1.8rem);overflow-wrap:anywhere}.warning,.error{padding:11px 13px;border-radius:9px;margin:10px 0}.warning{color:var(--warn);background:var(--warnbg)}.error{color:var(--bad);background:var(--badbg)}.steps{display:grid;gap:9px;margin:14px 0}.step{border:1px solid var(--line);border-radius:10px;padding:11px 13px}.step b{display:block;margin-bottom:3px}.step p{margin:0;color:var(--muted);overflow-wrap:anywhere}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:12px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.82rem}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f1f4f0;color:var(--muted);font-size:.72rem;text-transform:capitalize}th:first-child,td:first-child{text-align:left}tr:last-child td{border:0}.plot{display:block;width:100%;height:auto;max-height:310px;background:#fcfdfb;border:1px solid var(--line);border-radius:10px;margin-top:14px}.plot text{font:11px system-ui;fill:var(--muted)}.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted)}

    @media(prefers-reduced-motion:no-preference){.panel:not([hidden]){animation:enter .18s ease-out}@keyframes enter{from{opacity:.5;transform:translateY(4px)}}}

<body>
<main class="shell">
  <div class="top"><a class="back" href="/?course=KP21517001" aria-label="Kembali ke mata kuliah">← Kembali ke mata kuliah</a></div>
  <header class="hero"><p class="eyebrow">Laboratorium interaktif</p><h1>Metode Numerik</h1><p class="lead">Bandingkan metode, telusuri iterasi, dan lihat perilaku solusi. Gunakan titik untuk desimal pada kolom angka; ekspresi menerima titik atau koma.</p></header>
  <nav class="tabs" role="tablist" aria-label="Kelompok metode">
    <button class="tab" role="tab" id="tab-galat" aria-controls="galat" aria-selected="true">Galat &amp; Taylor</button>

</main>
<script type="module">
import * as core from './core.js';
import { compileExpression } from './expression.js';

const nf=new Intl.NumberFormat('id-ID',{maximumFractionDigits:10});
const fmt=v=>typeof v==='number'?(Number.isFinite(v)?nf.format(v):'—'):Array.isArray(v)?`[${v.map(fmt).join('; ')}]`:typeof v==='object'&&v?`{${Object.entries(v).map(([k,x])=>`${k}: ${fmt(x)}`).join('; ')}}`:String(v??'—');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=(form,name)=>{const v=Number(form.elements[name].value);if(!Number.isFinite(v))throw new Error(`Nilai “${name}” harus berupa angka.`);return v};
const expr=(form,name='fx')=>compileExpression(form.elements[name].value);
const matrix=s=>{const rows=s.trim().split(/\n|;/).map(r=>r.trim()).filter(Boolean).map(r=>r.split(/[,\s]+/).map(Number));if(!rows.length||rows.some(r=>r.some(v=>!Number.isFinite(v))||r.length!==rows.length))throw new Error('Matriks A harus persegi; pisahkan kolom dengan koma dan baris dengan titik koma.');return rows};
const vector=s=>{const a=s.split(/[,\s]+/).map(Number);if(!a.length||a.some(v=>!Number.isFinite(v)))throw new Error('Vektor harus berisi angka yang dipisahkan koma.');return a};
const points=s=>{const p=s.trim().split(';').map(r=>r.split(',').map(Number));if(p.length<2||p.some(q=>q.length!==2||q.some(v=>!Number.isFinite(v))))throw new Error('Titik harus berformat x,y; x,y dan sedikitnya dua titik.');return p};
const opts=f=>({tolerance:n(f,'tol'),maxIterations:n(f,'max')});
const fields={
  exact:['Nilai eksak','number','1.41421356237'],approx:['Nilai hampiran','number','1.4142'],fx:['f(x)','expression','x^3-x-2'],gx:['g(x)','expression','(x+2)^(1/3)'],df:['f\u2032(x)','expression','3*x^2-1'],a:['Batas bawah / tebakan pertama','number','1'],b:['Batas atas / tebakan kedua','number','2'],x0:['x₀','number','1.5'],x:['Nilai x tujuan','number','1'],y0:['y₀','number','1'],h:['Ukuran langkah h','number','0.1'],tol:['Toleransi','number','0.000001'],max:['Iterasi maksimum','number','50'],order:['Orde','number','4'],sub:['Jumlah subinterval','number','6'],A:['Matriks A','matrix','4,1;2,3'],B:['Vektor b','text','1,2'],initial:['Vektor awal','text','0,0'],pts:['Titik data (x,y; x,y)','text','0,1;1,3;2,2;3,5'],ode:['f(x,y)','expression','x+y']
};
const configs={
  galat:{title:'Galat & Taylor',methods:{errors:['Analisis galat',['exact','approx']],taylor:['Deret Taylor',['fx','x0','x','order']]}},
  akar:{title:'Akar Persamaan',methods:{bisection:['Bisection',['fx','a','b','tol','max']],regulaFalsi:['Regula Falsi',['fx','a','b','tol','max']],fixedPoint:['Iterasi Titik Tetap',['gx','x0','tol','max']],newton:['Newton–Raphson',['fx','df','x0','tol','max']],secant:['Secant',['fx','a','b','tol','max']]}},
  spl:{title:'Sistem Persamaan Linear',methods:{gaussianElimination:['Eliminasi Gauss',['A','B']],gaussJordan:['Gauss–Jordan',['A','B']],luDecomposition:['Dekomposisi LU',['A']],jacobi:['Jacobi',['A','B','initial','tol','max']],gaussSeidel:['Gauss–Seidel',['A','B','initial','tol','max']]}},
  interpolasi:{title:'Interpolasi & Regresi',methods:{lagrange:['Interpolasi Lagrange',['pts','x']],newtonInterpolation:['Interpolasi Newton',['pts','x']],linearRegression:['Regresi Linear',['pts']]}},
  turunan:{title:'Turunan Numerik',methods:{forward:['Selisih Maju',['fx','x','h']],backward:['Selisih Mundur',['fx','x','h']],central:['Selisih Pusat',['fx','x','h']],second:['Turunan Kedua',['fx','x','h']]}},
  integrasi:{title:'Integrasi Numerik',methods:{trapezoid:['Trapesium',['fx','a','b','sub']],simpson13:['Simpson 1/3',['fx','a','b','sub']],simpson38:['Simpson 3/8',['fx','a','b','sub']],gaussLegendre:['Gauss–Legendre',['fx','a','b','order']]}},
  pdb:{title:'Persamaan Diferensial Biasa',methods:{euler:['Euler',['ode','x0','y0','x','h']],heun:['Heun',['ode','x0','y0','x','h']],rk4:['Runge–Kutta orde 4',['ode','x0','y0','x','h']]}}
};
const formulas={errors:'E_a=|x-\\hat{x}|,\\quad E_r=E_a/|x|',taylor:'f(x)\\approx\\sum_{k=0}^{n}\\frac{f^{(k)}(x_0)}{k!}(x-x_0)^k',bisection:'c=(a+b)/2',regulaFalsi:'c=(af(b)-bf(a))/(f(b)-f(a))',fixedPoint:'x_{k+1}=g(x_k)',newton:'x_{k+1}=x_k-f(x_k)/f\\prime(x_k)',secant:'x_{k+1}=x_k-f(x_k)(x_k-x_{k-1})/(f(x_k)-f(x_{k-1}))',gaussianElimination:'Ax=b',gaussJordan:'[A|b]\\longrightarrow[I|x]',luDecomposition:'PA=LU',jacobi:'x_i^{(k+1)}=(b_i-\\sum_{j\\ne i}a_{ij}x_j^{(k)})/a_{ii}',gaussSeidel:'x_i^{(k+1)}=(b_i-\\sum_{j\\ne i}a_{ij}x_j)/a_{ii}',lagrange:'P(x)=\\sum_i y_iL_i(x)',newtonInterpolation:'P(x)=f[x_0]+f[x_0,x_1](x-x_0)+\\cdots',linearRegression:'\\hat y=a+bx',forward:'f\\prime(x)\\approx(f(x+h)-f(x))/h',backward:'f\\prime(x)\\approx(f(x)-f(x-h))/h',central:'f\\prime(x)\\approx(f(x+h)-f(x-h))/(2h)',second:'f\\prime\\prime(x)\\approx(f(x+h)-2f(x)+f(x-h))/h^2',trapezoid:'I\\approx h(f_0+2\\sum f_i+f_n)/2',simpson13:'I\\approx h(f_0+4\\sum f_{ganjil}+2\\sum f_{genap}+f_n)/3',simpson38:'I\\approx3h(f_0+3\\sum f_i+2\\sum f_{3i}+f_n)/8',gaussLegendre:'I\\approx(b-a)\\sum_iw_if(x_i)/2',euler:'y_{n+1}=y_n+hf(x_n,y_n)',heun:'y_{n+1}=y_n+h(k_1+k_2)/2',rk4:'y_{n+1}=y_n+h(k_1+2k_2+2k_3+k_4)/6'};

function fieldHTML(key,prefix){const [label,type,value]=fields[key],id=`${prefix}-${key}`,preset=prefix==='pdb'&&key==='x0'?'0':value;if(type==='matrix'||type==='text')return `<div class="field wide"><label for="${id}">${label}</label><textarea id="${id}" name="${key}">${preset}</textarea><span class="hint">${type==='matrix'?'Contoh: 4,1;2,3':'Pisahkan nilai dengan koma; pasangan titik dengan titik koma.'}</span></div>`;const isExpr=type==='expression';return `<div class="field${isExpr?' wide':''}"><label for="${id}">${label}</label><input id="${id}" name="${key}" type="${isExpr?'text':'number'}" ${isExpr?'inputmode="text" autocomplete="off"':'step="any"'} value="${preset}" required>${isExpr?'<span class="hint">Gunakan *, ^, sin, cos, exp, log, sqrt; variabel x atau y.</span>':''}</div>`}
function createPanel(id,cfg,active){const methods=Object.entries(cfg.methods);const el=document.createElement('section');el.className='panel';el.id=id;el.setAttribute('role','tabpanel');el.setAttribute('aria-labelledby',`tab-${id}`);el.hidden=!active;el.innerHTML=`<div class="workspace"><form class="card form-card" novalidate><div class="form-head"><div><h2>${cfg.title}</h2><div class="formula" aria-label="Rumus metode"></div></div></div><div class="field"><label for="method-${id}">Metode</label><select id="method-${id}" name="method">${methods.map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></div><div class="field-grid" data-fields></div><button class="primary" type="submit">Hitung &amp; tampilkan langkah</button></form><section class="card output" aria-live="polite"><div class="empty">Pilih metode, periksa masukan, lalu hitung.</div></section></div>`;document.querySelector('#panels').append(el);const form=el.querySelector('form');const refresh=()=>{const method=form.elements.method.value;form.querySelector('[data-fields]').innerHTML=cfg.methods[method][1].map(key=>fieldHTML(key,id)).join('');renderMath(form.querySelector('.formula'),formulas[method])};form.elements.method.addEventListener('change',refresh);form.addEventListener('submit',e=>{e.preventDefault();calculate(id,form,el.querySelector('.output'))});refresh()}
function renderMath(el,source){el.textContent='';if(window.katex)katex.render(source,el,{throwOnError:false,displayMode:false});else el.setAttribute('data-math',source)}
function rerenderMath(){document.querySelectorAll('[data-math]').forEach(el=>{const s=el.getAttribute('data-math');el.removeAttribute('data-math');renderMath(el,s)})}

const binom=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-i+1)/i;return r};
function derivativeAt(fn,order,x){if(order===0)return fn(x);const h=1e-3;let sum=0;for(let k=0;k<=order;k++)sum+=(-1)**k*binom(order,k)*fn(x+(order/2-k)*h);return sum/h**order}
function run(id,m,f){
  if(m==='errors')return core.calculateErrors(n(f,'exact'),n(f,'approx'));
  if(m==='taylor'){const fn=expr(f),o=Math.trunc(n(f,'order'));if(o<0||o>8)throw new Error('Orde Taylor harus bilangan bulat 0–8.');const x0=n(f,'x0');return core.taylorSeries(Array.from({length:o+1},(_,i)=>()=>derivativeAt(fn,i,x0)),n(f,'x'),x0)}
  if(id==='akar'){if(m==='fixedPoint')return core.fixedPoint(expr(f,'gx'),n(f,'x0'),opts(f));if(m==='newton')return core.newton(expr(f),expr(f,'df'),n(f,'x0'),opts(f));if(m==='secant')return core.secant(expr(f),n(f,'a'),n(f,'b'),opts(f));return core[m](expr(f),n(f,'a'),n(f,'b'),opts(f))}
  if(id==='spl'){const A=matrix(f.elements.A.value);if(m==='luDecomposition')return core.luDecomposition(A);const B=vector(f.elements.B.value);if(B.length!==A.length)throw new Error('Panjang vektor b harus sama dengan ukuran matriks.');if(m==='jacobi'||m==='gaussSeidel'){const initial=vector(f.elements.initial.value);return core[m](A,B,{...opts(f),initial})}return core[m](A,B)}
  if(id==='interpolasi')return m==='linearRegression'?core.linearRegression(points(f.elements.pts.value)):core[m](points(f.elements.pts.value),n(f,'x'));
  if(id==='turunan')return core.finiteDifference(expr(f),n(f,'x'),n(f,'h'),m);
  if(id==='integrasi'){const fn=expr(f),a=n(f,'a'),b=n(f,'b');return m==='gaussLegendre'?core.gaussLegendre(fn,a,b,Math.trunc(n(f,'order'))):core[m](fn,a,b,Math.trunc(n(f,'sub')))}
  return core[m](expr(f,'ode'),n(f,'x0'),n(f,'y0'),n(f,'x'),n(f,'h'));
}
function summary(m,r){if(m==='errors')return `Galat absolut ${fmt(r.absolute)} · relatif ${fmt(r.relative)} · persentase ${fmt(r.percentage)}%`;if(r.root!==undefined)return `x ≈ ${fmt(r.root)}`;if(r.solution)return `x = ${fmt(r.solution)}`;if(m==='luDecomposition')return `L = ${fmt(r.L)} · U = ${fmt(r.U)}`;if(m==='linearRegression')return `ŷ = ${fmt(r.intercept)} + ${fmt(r.slope)}x · R² = ${fmt(r.r2)}`;if(r.y!==undefined)return `y(${fmt(r.x)}) ≈ ${fmt(r.y)}`;return `Hasil ≈ ${fmt(r.value)}`}
function rowData(r){const rows=r.iterations||r.steps||r.samples||r.residuals||[];return rows.slice(0,40)}
function tableHTML(rows){if(!rows.length)return '';const keys=[...new Set(rows.flatMap(Object.keys))].filter(k=>rows.some(r=>['number','string','boolean'].includes(typeof r[k])||Array.isArray(r[k]))).slice(0,9);return `<div class="table-wrap"><table><thead><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${fmt(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length>=40?'<p class="warning">Tabel dibatasi 40 baris agar tetap ringan.</p>':''}`}
function warning(r){if(r.converged===false)return 'Metode belum konvergen dalam batas iterasi. Periksa tebakan, interval, atau toleransi.';if((r.iterations||r.steps||[]).length>30)return 'Iterasi cukup panjang. Pertimbangkan tebakan awal atau ukuran langkah yang lebih sesuai.';return ''}
function plotSVG(samples,{area=false,mark=null}={}){const clean=samples.filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y));if(clean.length<2)return '';let xs=clean.map(p=>p.x),ys=clean.map(p=>p.y);let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys,0),ymax=Math.max(...ys,0);if(xmin===xmax){xmin--;xmax++}if(ymin===ymax){ymin--;ymax++}const W=720,H=300,P=32,X=x=>P+(x-xmin)/(xmax-xmin)*(W-2*P),Y=y=>H-P-(y-ymin)/(ymax-ymin)*(H-2*P);const path=clean.map((p,i)=>`${i?'L':'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');const fill=area?`${path} L${X(clean.at(-1).x)},${Y(0)} L${X(clean[0].x)},${Y(0)} Z`:'';return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik hasil numerik"><line x1="${P}" y1="${Y(0)}" x2="${W-P}" y2="${Y(0)}" stroke="#cbd4cd"/><line x1="${X(0)}" y1="${P}" x2="${X(0)}" y2="${H-P}" stroke="#cbd4cd"/>${area?`<path d="${fill}" fill="#65a98a33"/>`:''}<path d="${path}" fill="none" stroke="#176b4c" stroke-width="3" stroke-linejoin="round"/>${clean.length<80?clean.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="#176b4c"/>`).join(''):''}${mark!==null&&Number.isFinite(mark)?`<circle cx="${X(mark)}" cy="${Y(0)}" r="6" fill="#b45309"/>`:''}<text x="${P}" y="${H-8}">${fmt(xmin)}</text><text x="${W-P}" y="${H-8}" text-anchor="end">${fmt(xmax)}</text></svg>`}
function graph(id,m,f,r){try{
  if(id==='galat'){if(m==='errors')return plotSVG([{x:0,y:n(f,'exact')},{x:1,y:n(f,'approx')}]);const fn=expr(f),a=n(f,'x0'),b=n(f,'x');return plotSVG(Array.from({length:51},(_,i)=>{const x=Math.min(a,b)+(Math.max(a,b)-Math.min(a,b)||1)*i/50;return{x,y:fn(x)}}),{mark:b})}
  if(id==='akar'){const fn=m==='fixedPoint'?x=>expr(f,'gx')(x)-x:expr(f);const center=r.root,span=Math.max(2,Math.abs(center||0));return plotSVG(Array.from({length:101},(_,i)=>{const x=center-span+2*span*i/100;return{x,y:fn(x)}}),{mark:center})}
  if(id==='spl'){const values=r.solution||(r.U?r.U.flat():[]);return plotSVG(values.map((y,x)=>({x:x+1,y})))}
  if(id==='interpolasi'){const ps=points(f.elements.pts.value);let fn;if(m==='linearRegression')fn=x=>r.intercept+r.slope*x;else fn=x=>core[m](ps,x).value;const lo=Math.min(...ps.map(p=>p[0])),hi=Math.max(...ps.map(p=>p[0]));return plotSVG(Array.from({length:101},(_,i)=>{const x=lo+(hi-lo)*i/100;return{x,y:fn(x)}}))}
  if(id==='turunan'){const fn=expr(f),center=n(f,'x'),span=Math.max(Math.abs(n(f,'h'))*4,.5);return plotSVG(Array.from({length:51},(_,i)=>{const x=center-span+2*span*i/50;return{x,y:fn(x)}}),{mark:center})}
  if(id==='integrasi'){const fn=expr(f),a=n(f,'a'),b=n(f,'b');return plotSVG(Array.from({length:101},(_,i)=>{const x=a+(b-a)*i/100;return{x,y:fn(x)}}),{area:true})}
  if(id==='pdb')return plotSVG(r.points);
  return ''
}catch{return ''}}
function calculate(id,form,out){const m=form.elements.method.value;out.setAttribute('aria-busy','true');try{if(!form.checkValidity()){form.reportValidity();throw new Error('Lengkapi semua masukan dengan nilai yang valid.')}const r=run(id,m,form);const rows=rowData(r),warn=warning(r);out.innerHTML=`<div class="result"><small>Hasil ${configs[id].methods[m][0]}</small><strong>${summary(m,r)}</strong></div><div class="steps"><div class="step"><b>1. Model</b><p>Masukan divalidasi, lalu rumus metode diterapkan.</p></div><div class="step"><b>2. Proses</b><p>${rows.length?`${rows.length}${(r.iterations||r.steps||[]).length>40?' dari lebih banyak':''} langkah tercatat.`:'Perhitungan langsung selesai.'}</p></div><div class="step"><b>3. Interpretasi</b><p>${r.converged===true?'Kriteria konvergensi terpenuhi.':'Nilai akhir ditampilkan dengan format desimal Indonesia.'}</p></div></div>${warn?`<div class="warning" role="status">${warn}</div>`:''}${tableHTML(rows)}${graph(id,m,form,r)}`}catch(e){out.innerHTML=`<div class="error" role="alert"><strong>Perhitungan belum dapat dilakukan.</strong><br>Masukan tidak valid: ${esc(e.message||e)}</div><div class="empty">Perbaiki masukan lalu coba kembali.</div>`}finally{out.removeAttribute('aria-busy')}}

Object.entries(configs).forEach(([id,cfg],i)=>createPanel(id,cfg,i===0));
const tabs=[...document.querySelectorAll('[role="tab"]')];
function activate(tab){tabs.forEach(t=>{const on=t===tab;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on});tab.focus()}
tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>activate(tab));tab.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;activate(tabs[next])})});
window.addEventListener('load',rerenderMath);
</script>
