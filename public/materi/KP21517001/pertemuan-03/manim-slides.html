<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teorema Bolzano — Manim Slides Interaktif (@librayn)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/theme/black.css">
  <style>
    body, html { background: #111b21; color: #fff; margin: 0; padding: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    .top-hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; background: rgba(17, 27, 33, 0.88); backdrop-filter: blur(8px);
      border-bottom: 1px solid #202c33;
    }
    .top-hud a {
      color: #00a884; text-decoration: none; font-size: 0.9rem; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .top-hud .title { font-size: 0.9rem; color: #e9edef; font-weight: 500; }
    .bottom-hud {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: center; align-items: center; gap: 16px;
      padding: 10px 20px; background: rgba(17, 27, 33, 0.88); backdrop-filter: blur(8px);
      border-top: 1px solid #202c33;
    }
    .hud-btn {
      background: #202c33; color: #00a884; border: 1px solid #00a884;
      padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .hud-btn:hover { background: #00a884; color: #111b21; }
    .slide-counter { color: #8696a0; font-size: 0.85rem; font-weight: 500; }
    .reveal .slide-background video { object-fit: contain !important; }
  </style>
</head>
<body>
  <div class="top-hud">
    <a href="/materi/KP21517001/pertemuan-03/index.html">← Kembali ke Materi P03</a>
    <span class="title">🎬 Manim Slides: Teorema Bolzano ($f(x) = x^3 - 4x - 9 = 0$)</span>
    <span style="color:#00a884; font-size:0.85rem; font-weight:700;">@librayn</span>
  </div>

  <div class="reveal">
    <div class="slides">
      <section
        data-background-size="contain"
        data-background-color="#111b21"
        data-background-video="teorema_bolzano_clean_slides_assets/1c5d796b523cea00.mp4"
        data-background-video-muted
        data-autoplay
      ></section>
      <section
        data-background-size="contain"
        data-background-color="#111b21"
        data-background-video="teorema_bolzano_clean_slides_assets/83ca4874c500778e.mp4"
        data-background-video-muted
        data-autoplay
      ></section>
      <section
        data-background-size="contain"
        data-background-color="#111b21"
        data-background-video="teorema_bolzano_clean_slides_assets/4079458276a0dee3.mp4"
        data-background-video-muted
        data-autoplay
      ></section>
      <section
        data-background-size="contain"
        data-background-color="#111b21"
        data-background-video="teorema_bolzano_clean_slides_assets/c43e2dbe041eefa0.mp4"
        data-background-video-muted
        data-autoplay
      ></section>
      <section
        data-background-size="contain"
        data-background-color="#111b21"
        data-background-video="teorema_bolzano_clean_slides_assets/cd71f5c64c2b9801.mp4"
        data-background-video-muted
        data-autoplay
      ></section>
      <section
        data-background-size="contain"
        data-background-color="#111b21"
        data-background-video="teorema_bolzano_clean_slides_assets/3327d64f2a013c0c.mp4"
        data-background-video-muted
        data-autoplay
      ></section>
    </div>
  </div>

  <div class="bottom-hud">
    <button class="hud-btn" onclick="Reveal.prev()">◀ Sebelumnya</button>
    <button class="hud-btn" onclick="togglePlayCurrent()">⏯ Putar Ulang</button>
    <button class="hud-btn" onclick="Reveal.next()">Selanjutnya ▶</button>
    <span class="slide-counter" id="slideIndicator">Slide 1 / 6</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/reveal.js"></script>
  <script>
    Reveal.initialize({
      width: '100%',
      height: '100%',
      margin: 0.04,
      controls: true,
      progress: true,
      slideNumber: false,
      hash: false,
      history: false,
      keyboard: true,
      overview: true,
      center: true,
      touch: true,
      autoPlayMedia: true,
      transition: 'none',
      backgroundTransition: 'none'
    });

    function updateCounter() {
      const idx = Reveal.getState().indexh + 1;
      const total = Reveal.getTotalSlides();
      const el = document.getElementById('slideIndicator');
      if (el) el.textContent = `Slide ${idx} / ${total}`;
    }

    function playActiveVideo() {
      setTimeout(() => {
        const activeSlide = Reveal.getCurrentSlide();
        if (!activeSlide) return;
        const bg = Reveal.getSlideBackground(activeSlide);
        if (bg) {
          const v = bg.querySelector('video');
          if (v) {
            v.currentTime = 0;
            v.play().catch(() => {});
          }
        }
      }, 100);
    }

    function togglePlayCurrent() {
      const activeSlide = Reveal.getCurrentSlide();
      if (!activeSlide) return;
      const bg = Reveal.getSlideBackground(activeSlide);
      if (bg) {
        const v = bg.querySelector('video');
        if (v) {
          if (v.paused) v.play();
          else { v.currentTime = 0; v.play(); }
        }
      }
    }

    Reveal.on('slidechanged', () => {
      updateCounter();
      playActiveVideo();
    });

    Reveal.on('ready', () => {
      updateCounter();
      playActiveVideo();
    });

    // Tap layar untuk maju
    document.addEventListener('click', (e) => {
      if (e.target.closest('.top-hud') || e.target.closest('.bottom-hud')) return;
      Reveal.next();
    });
  </script>
</body>
</html>
