<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#4338ca">
  <title>Kalkulator Integral Kontur</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <style>
    :root{--p:#4338ca;--a:#6558df;--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--ink:#172033;--muted:#64748b;--red:#dc2626;--amber:#d97706}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}button,input{font:inherit}.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,var(--p),var(--a));box-shadow:0 4px 18px #312e8155;color:#fff}.nav{max-width:1180px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.nav-back-btn{color:#fff;text-decoration:none;border:1px solid #ffffff55;background:#ffffff1f;border-radius:9px;padding:7px 12px;font-weight:700;white-space:nowrap}.brand{text-align:right;font-weight:800}.brand small{display:block;color:#dbeafe;font-weight:400}.wrap{max-width:1180px;margin:auto;padding:20px 14px 48px}.hero,.panel,.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 15px #1e293b0b}.hero{padding:20px;margin-bottom:16px;background:linear-gradient(135deg,#fff,#eef2ff)}h1{font-size:clamp(1.35rem,4vw,2rem);margin:0 0 5px;color:#312e81}.hero p,.hint{margin:0;color:var(--muted)}h2{font-size:1.05rem;margin:0 0 12px;color:#312e81}.presets{display:grid;grid-template-columns:repeat(5,minmax(155px,1fr));gap:10px;overflow-x:auto;padding:2px 1px 8px}.preset{min-height:105px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;cursor:pointer;color:var(--ink);transition:.18s}.preset:hover{border-color:#818cf8;transform:translateY(-1px)}.preset.active{color:#fff;background:linear-gradient(135deg,var(--p),var(--a));border-color:transparent;box-shadow:0 7px 18px #4338ca42}.preset b{display:block;margin-bottom:6px}.preset .math{font-size:.78rem;display:block;overflow:hidden}.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;margin-top:16px}.panel{padding:17px;position:sticky;top:75px}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field label{display:block;font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:4px}.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;outline:none}.field input:focus{border-color:var(--a);box-shadow:0 0 0 3px #6366f122}.error{min-height:22px;color:var(--red);font-size:.82rem;margin-top:7px}.canvas-box{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;position:relative;touch-action:none}.canvas-box canvas{display:block;width:100%;height:360px}.canvas-tip{position:absolute;left:8px;bottom:7px;background:#ffffffdd;border:1px solid var(--line);border-radius:7px;padding:3px 7px;color:var(--muted);font-size:.7rem;pointer-events:none}.reset{margin-top:8px;width:100%;border:1px solid var(--line);background:#fff;color:var(--p);padding:7px;border-radius:8px;cursor:pointer}.outputs{display:grid;gap:11px}.stage{padding:16px;border-left:4px solid #818cf8}.stage h3{font-size:.95rem;margin:0 0 9px}.math-block{overflow-x:auto;padding:9px;background:#f8fafc;border-radius:9px;margin:7px 0}.pole-list{display:flex;flex-wrap:wrap;gap:7px}.badge{border-radius:999px;padding:4px 9px;font-size:.78rem;font-weight:700}.inside{background:#fee2e2;color:#b91c1c}.outside{background:#e2e8f0;color:#475569}.boundary{background:#fef3c7;color:#92400e}.empty{text-align:center;padding:50px 20px;color:var(--muted)}@media(max-width:820px){.grid{grid-template-columns:1fr}.panel{position:static}.canvas-box canvas{height:330px}.presets{grid-template-columns:repeat(5,170px)}}@media(max-width:430px){.brand small{display:none}.nav{padding:8px}.nav-back-btn{font-size:.78rem}.wrap{padding:12px 9px}.panel,.stage{padding:13px}.inputs{gap:6px}.canvas-box canvas{height:300px}}
  </style>
</head>
<body>
<header class="topbar"><nav class="nav"><a class="nav-back-btn" href="/" onclick="handleGoBack(event)">← Kembali ke KelasKu</a><div class="brand">Integral Kontur<small>Analisis Kompleks · KP21517003</small></div></nav></header>
<main class="wrap">
  <section class="hero"><h1>Kalkulator Integral Kontur</h1><p>Eksplorasi kutub, residu, dan Teorema Residu Cauchy pada kontur lingkaran berorientasi positif (CCW).</p></section>
  <section aria-labelledby="preset-title"><h2 id="preset-title">Pilih contoh soal</h2><div class="presets" id="presets"></div></section>
  <div class="grid">
    <aside class="panel"><h2>Kontur <span class="math" data-tex="C:|z-(a+bi)|=r"></span></h2><div class="inputs"><div class="field"><label for="a">Pusat a</label><input id="a" type="number" step="any" inputmode="decimal"></div><div class="field"><label for="b">Pusat b</label><input id="b" type="number" step="any" inputmode="decimal"></div><div class="field"><label for="r">Jari-jari r</label><input id="r" type="number" step="any" min="0" inputmode="decimal"></div></div><div id="error" class="error" role="alert"></div><div class="canvas-box" id="canvasBox"><canvas id="plane" aria-label="Bidang Argand interaktif"></canvas><span class="canvas-tip">Geser · wheel/pinch untuk zoom</span></div><button class="reset" id="resetView">Reset tampilan</button></aside>
    <section class="outputs" id="output"><div class="empty">Pilih kartu soal untuk memulai analisis.</div></section>
  </div>
</main>
<script>
'use strict';
const presets=[
 {name:'Soal 1',preview:'\\oint_C\\frac1z\\,dz',formula:'\\frac1z',den:'z=0',poles:[{x:0,y:0,res:'1'}],defaults:[0,0,1]},
 {name:'Soal 2',preview:'\\oint_C\\frac{z^2+1}{z-2}\\,dz',formula:'\\frac{z^2+1}{z-2}',den:'z-2=0\\Rightarrow z=2',poles:[{x:2,y:0,res:'5'}],defaults:[0,0,1]},
 {name:'Soal 3',preview:'\\oint_C\\frac{z^2+1}{z-2}\\,dz',formula:'\\frac{z^2+1}{z-2}',den:'z-2=0\\Rightarrow z=2',poles:[{x:2,y:0,res:'5'}],defaults:[0,0,3]},
 {name:'Soal 4',preview:'\\oint_C\\frac{e^z}{z(z-1)}\\,dz',formula:'\\frac{e^z}{z(z-1)}',den:'z(z-1)=0\\Rightarrow z=0,1',poles:[{x:0,y:0,res:'-1'},{x:1,y:0,res:'e'}],defaults:[0,0,2]},
 {name:'Soal 5',preview:'\\oint_C\\frac{\\cos z}{z^2+9}\\,dz',formula:'\\frac{\\cos z}{z^2+9}',den:'z^2+9=0\\Rightarrow z=\\pm3i',poles:[{x:0,y:3,res:'\\frac{\\cosh 3}{6i}'},{x:0,y:-3,res:'-\\frac{\\cosh 3}{6i}'}],defaults:[0,0,4]}
];
const $=id=>document.getElementById(id), state={selected:null,a:0,b:0,r:1,scale:38,panX:0,panY:0};
function tex(s,display=false){const el=document.createElement(display?'div':'span');try{katex.render(s,el,{displayMode:display,throwOnError:false})}catch(_){el.textContent=s}return el.outerHTML}
function complex(x,y){if(!y)return `${x}`;if(!x)return y===1?'i':y===-1?'-i':`${y}i`;return `${x}${y<0?'':'+'}${y===1?'i':y===-1?'-i':`${y}i`}`}
function classify(p){const d=Math.hypot(p.x-state.a,p.y-state.b),eps=1e-9*Math.max(1,state.r);return {d,status:Math.abs(d-state.r)<=eps?'boundary':d<state.r?'inside':'outside'}}
function renderPresets(){const root=$('presets');root.innerHTML='';presets.forEach((p,i)=>{const b=document.createElement('button');b.className='preset'+(state.selected===i?' active':'');b.innerHTML=`<b>${p.name}</b><span class="math">${tex(p.preview)}</span><span class="hint">${tex(`|z|=${p.defaults[2]}`)}</span>`;b.onclick=()=>selectPreset(i);root.appendChild(b)})}
function selectPreset(i){state.selected=i;[state.a,state.b,state.r]=presets[i].defaults;state.scale=38;state.panX=state.panY=0;$('a').value=state.a;$('b').value=state.b;$('r').value=state.r;save();renderPresets();update()}
function sumResidues(items){if(!items.length)return '0';const p=presets[state.selected];if(state.selected===4&&items.length===2)return '0';if(state.selected===3&&items.length===2)return 'e-1';return items.map(x=>x.res).join('+').replace('+-','-')}
function update(){if(state.selected===null){draw();return}state.a=Number($('a').value);state.b=Number($('b').value);state.r=Number($('r').value);if(!Number.isFinite(state.a)||!Number.isFinite(state.b)||!Number.isFinite(state.r)||state.r<=0){$('error').textContent='Masukkan a, b valid dan r > 0.';$('output').innerHTML='<div class="empty">Kontur belum valid. Perbaiki parameter untuk melihat analisis.</div>';draw();return}$('error').textContent='';save();const p=presets[state.selected],tests=p.poles.map(q=>({...q,...classify(q)})),boundary=tests.filter(q=>q.status==='boundary'),inside=tests.filter(q=>q.status==='inside'),sum=sumResidues(inside);const positions=tests.map(q=>`${tex(`z=${complex(q.x,q.y)}`)} <span class="badge ${q.status}">${q.status==='inside'?'Di dalam C':q.status==='outside'?'Di luar C':'Pada batas C'}</span>`).join('');const distance=tests.map(q=>tex(`|(${complex(q.x,q.y)})-(${complex(state.a,state.b)})|=${q.d.toFixed(4)}\;${q.status==='inside'?'<':q.status==='outside'?'>':'='}\;${state.r}`,true)).join('');let residue=inside.length?inside.map(q=>tex(`\\operatorname{Res}(f,${complex(q.x,q.y)})=\\lim_{z\\to ${complex(q.x,q.y)}}(z-${complex(q.x,q.y)})${p.formula}=${q.res}`,true)).join(''):'<p class="hint">Tidak ada kutub di dalam kontur; tidak ada residu yang dijumlahkan.</p>';let final=boundary.length?`<div class="badge boundary">Integral kontur tidak terdefinisi dalam kerangka Teorema Residu: terdapat kutub pada lintasan C.</div>`:tex(`\\oint_C ${p.formula}\\,dz=2\\pi i\\sum\\operatorname{Res}=2\\pi i(${sum})${sum==='0'?'=\\mathbf{0}':''}`,true);$('output').innerHTML=`<article class="stage"><h3>Tahap 1 · Pencarian titik singular</h3><div class="math-block">${tex(`${p.den}`,true)}</div><p>Penyebut nol menghasilkan ${p.poles.length} kutub sederhana.</p></article><article class="stage"><h3>Tahap 2 · Uji posisi terhadap kontur</h3><div class="pole-list">${positions}</div><div class="math-block">${distance}</div></article><article class="stage"><h3>Tahap 3 · Perhitungan residu di dalam C</h3><div class="math-block">${residue}</div></article><article class="stage"><h3>Tahap 4 · Teorema Residu Cauchy</h3><div class="math-block">${final}</div></article>`;draw()}
function save(){if(state.selected!==null)localStorage.setItem('integralContourState',JSON.stringify({selected:state.selected,a:state.a,b:state.b,r:state.r}))}
function load(){try{const s=JSON.parse(localStorage.getItem('integralContourState'));if(s&&presets[s.selected]&&Number(s.r)>0){Object.assign(state,s);$('a').value=s.a;$('b').value=s.b;$('r').value=s.r}}catch(_){}renderPresets();update()}
const canvas=$('plane'),ctx=canvas.getContext('2d');
function draw(){const box=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;if(canvas.width!==Math.round(box.width*dpr)||canvas.height!==Math.round(box.height*dpr)){canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);const w=box.width,h=box.height,ox=w/2+state.panX,oy=h/2+state.panY,S=state.scale;ctx.clearRect(0,0,w,h);ctx.lineWidth=1;ctx.strokeStyle='#e2e8f0';const step=S*(S<25?2:1);for(let x=ox%step;x<w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=oy%step;y<h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(w,oy);ctx.moveTo(ox,0);ctx.lineTo(ox,h);ctx.stroke();ctx.fillStyle='#64748b';ctx.font='11px system-ui';ctx.fillText('Re',w-20,oy-7);ctx.fillText('Im',ox+6,13);if(state.selected===null||state.r<=0)return;const cx=ox+state.a*S,cy=oy-state.b*S,rr=state.r*S;ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.fillStyle='#6558df20';ctx.fill();ctx.strokeStyle='#4338ca';ctx.lineWidth=2.5;ctx.stroke();const ang=-.65,ax=cx+rr*Math.cos(ang),ay=cy+rr*Math.sin(ang);ctx.fillStyle='#4338ca';ctx.save();ctx.translate(ax,ay);ctx.rotate(ang+Math.PI/2);ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(-6,5);ctx.lineTo(6,5);ctx.closePath();ctx.fill();ctx.restore();ctx.fillText('CCW',ax+9,ay-7);presets[state.selected].poles.forEach(p=>{const c=classify(p),x=ox+p.x*S,y=oy-p.y*S,color=c.status==='inside'?'#dc2626':c.status==='boundary'?'#d97706':'#94a3b8';ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-6,y-6);ctx.lineTo(x+6,y+6);ctx.moveTo(x+6,y-6);ctx.lineTo(x-6,y+6);ctx.stroke();ctx.fillStyle=color;ctx.font='bold 12px system-ui';ctx.fillText(`z=${complex(p.x,p.y)}${c.status==='boundary'?' (batas)':''}`,x+9,y-8)})}
let pointers=new Map(),lastDist=0,lastCenter=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const pts=[...pointers.values()];if(pts.length===1){state.panX+=e.clientX-old.x;state.panY+=e.clientY-old.y}else if(pts.length===2){const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),c={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};if(lastDist){const factor=d/lastDist,newS=Math.max(12,Math.min(140,state.scale*factor)),rect=canvas.getBoundingClientRect(),px=c.x-rect.left,py=c.y-rect.top,ratio=newS/state.scale;state.panX=px-canvas.clientWidth/2-(px-canvas.clientWidth/2-state.panX)*ratio;state.panY=py-canvas.clientHeight/2-(py-canvas.clientHeight/2-state.panY)*ratio;state.scale=newS}lastDist=d;lastCenter=c}draw()});function end(e){pointers.delete(e.pointerId);lastDist=0;lastCenter=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('wheel',e=>{e.preventDefault();const rect=canvas.getBoundingClientRect(),px=e.clientX-rect.left,py=e.clientY-rect.top,f=e.deltaY<0?1.12:.89,newS=Math.max(12,Math.min(140,state.scale*f)),ratio=newS/state.scale;state.panX=px-canvas.clientWidth/2-(px-canvas.clientWidth/2-state.panX)*ratio;state.panY=py-canvas.clientHeight/2-(py-canvas.clientHeight/2-state.panY)*ratio;state.scale=newS;draw()},{passive:false});$('resetView').onclick=()=>{state.scale=38;state.panX=state.panY=0;draw()};['a','b','r'].forEach(id=>$(id).addEventListener('input',update));window.addEventListener('resize',draw);function handleGoBack(e){if(history.length>1){e.preventDefault();history.back()}}window.handleGoBack=handleGoBack;window.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('[data-tex]').forEach(el=>{katex.render(el.dataset.tex,el,{throwOnError:false})});load()});
</script>
</body>
</html>
